const NODES=[{"id": "actions/adult", "type": "Actions", "title": "Adult Arousal Actions", "description": "Optional arousal-adjustment actions bridging OSL Aroused and SexLab Aroused.", "tags": ["actions", "skyrimnet", "adult", "arousal", "osl", "sexlab"], "group": "actions", "sz": 31, "body": "# Overview\n\nThe optional Adult module ships two FOMOD variants \u2014 one per arousal framework. Each ships exactly one action with the same narrative intent (\"the speaker's blood runs hotter or cooler in the moment \u2014 a flirtation, a cold bucket of water, a glance held a beat too long, a chastening word from a priest\"), differing only in the bridge script. The matching context prompts live in [/prompts/adult.md](/prompts/adult.md).\n\nThe two variants ship 2 YAMLs total, one each, both enabled.\n\n# Member Actions\n\n| File | Module | Action | Script.Function | Purpose |\n|---|---|---|---|---|\n| modifyarousal.yaml | Adult-OSLAroused | ModifyArousal | SeverActions_Arousal.ModifyArousal_Execute | Push arousal up or down via the OSL Aroused bridge |\n| modifyarousalslo.yaml | Adult-SLOAroused | ModifyArousalSLO | SeverActions_SLOArousal.ModifyArousal_Execute | Push arousal up or down via the SexLab Aroused bridge |\n\n# Notes\n\n- Only one variant should be installed, matching the arousal framework in the load order; both write through the bridge scripts documented in [/scripts/magic-travel.md](/scripts/magic-travel.md).\n- The SLO variant adjusts the exposure component directly (UpdateActorExposure) rather than treating total arousal as the exposure value.\n- Both modules are optional FOMOD picks; without an arousal framework installed they do nothing.\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Adult-OSLAroused/SKSE/Plugins/SkyrimNet/config/actions/modifyarousal.yaml`\n[2] `sources/SeverActions/Actions/Adult-SLOAroused/SKSE/Plugins/SkyrimNet/config/actions/modifyarousalslo.yaml`"}, {"id": "actions/arrest", "type": "Actions", "title": "Arrest Actions", "description": "Bounty tracking, arrest, cross-cell dispatch, escort pleas and judgment actions of the Arrest module.", "tags": ["actions", "skyrimnet", "arrest", "bounty", "guards", "jail", "crime"], "group": "actions", "sz": 46, "body": "# Overview\n\nThe Arrest module (FOMOD option \"Arrest Actions\", optional) implements the working crime system: guards log bounties, arrest suspects, dispatch across cells with off-screen escort, investigate homes for evidence, confront the player over an existing bounty, and pass judgment on delivered prisoners. Execution functions are split across SeverActions_ArrestBounty (the ledger), SeverActions_Arrest (arrest, dispatch, escort), SeverActions_ArrestPlayer (player confrontation) and SeverActions_ArrestJudgment (judgment phase).\n\nThe module ships 15 YAMLs \u2014 14 executable actions plus the `cat_arrest` category file.\n\n# Member Actions\n\n## Bounty ledger\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| cat_arrest.yaml | Arrest | arrest | \u2014 | Category file grouping all law-enforcement actions |\n| addbountytoplayer.yaml | AddBountyToPlayer | arrest | SeverActions_ArrestBounty.AddBountyToPlayer_Internal | Log a witnessed crime against the player in this hold \u2014 the precondition for ArrestPlayer |\n| paynpcbountytoguard.yaml | PayNpcBountyToGuard | arrest | SeverActions_ArrestBounty.PayNpcBountyToGuard_Internal | The player pays a guard to clear another person's tracked bounty |\n\n## Arrest and dispatch\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| arrestnpc.yaml | ArrestNPC | arrest | SeverActions_Arrest.ArrestNPC_Internal | Cuff and march a present suspect off to the cells |\n| dispatchguardtoarrest.yaml | DispatchGuardToArrest | arrest | SeverActions_Arrest.DispatchGuardToArrest_Execute | Send a guard across the hold to track down a named suspect and bring them in |\n| dispatchguardtohome.yaml | DispatchGuardToHome | arrest | SeverActions_Arrest.DispatchGuardToHome_Execute | Send a guard to search a suspect's home containers for evidence |\n\n## Escort and pleas\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| appealduringescort.yaml | AppealDuringEscort | arrest | SeverActions_Arrest.AppealDuringEscort_Internal | A prisoner being escorted makes a last plea \u2014 innocence, bribe, mercy |\n| acceptescortplea.yaml | AcceptEscortPlea | arrest | SeverActions_Arrest.AcceptEscortPlea_Internal | The escorting guard genuinely accepts the plea; cuffs come off and the hold bounty is wiped |\n| rejectescortplea.yaml | RejectEscortPlea | arrest | SeverActions_Arrest.RejectEscortPlea_Internal | The guard is not having any of it; the march to the cells resumes |\n\n## Player confrontation\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| arrestplayer.yaml | ArrestPlayer | arrest | SeverActions_ArrestPlayer.ArrestPlayer_Internal | Confront the player over an existing bounty; light bounties settle on the spot, over 300g they can submit, resist, bribe or talk |\n| acceptpersuasion.yaml | AcceptPersuasion | arrest | SeverActions_ArrestPlayer.AcceptPersuasion_Internal | The guard is genuinely convinced during a bounty confrontation and waves the player on |\n| rejectpersuasion.yaml | RejectPersuasion | arrest | SeverActions_ArrestPlayer.RejectPersuasion_Internal | The argument fails; the confrontation moves to submit-or-resist |\n\n## Judgment and release\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| orderjailed.yaml | OrderJailed | arrest | SeverActions_ArrestJudgment.OrderJailed_Execute | A jarl or magistrate finds against a prisoner standing judgment after a dispatch |\n| orderrelease.yaml | OrderRelease | arrest | SeverActions_ArrestJudgment.OrderRelease_Execute | The charges are found thin and the prisoner walks |\n| freefromjail.yaml | FreeFromJail | arrest | SeverActions_Arrest.FreeNPC_Internal | Release an NPC already sitting in a hold's cell \u2014 sentence served, pardon, or favor |\n\n# Flow Notes\n\n- AddBountyToPlayer must fire first; ArrestPlayer only works once a bounty exists on the books.\n- DispatchGuardToArrest routes the suspect to judgment (OrderJailed / OrderRelease); FreeFromJail is for an NPC already serving in a cell.\n- Escort pleas (AppealDuringEscort answered by Accept/RejectEscortPlea) can end an escort with the hold bounty wiped.\n- PayNpcBountyToGuard is a legal bounty settlement \u2014 deliberately distinct from the Economy module's CollectPayment, which is for merchant tabs.\n\n# Related\n\n- Bounty ledger, judgment and player-arrest scripts: [/scripts/crime.md](/scripts/crime.md)\n- Bounty, warrant and jail status prompts: [/prompts/arrest.md](/prompts/arrest.md)\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Arrest/SKSE/Plugins/SkyrimNet/config/actions/*.yaml`"}, {"id": "actions/basic", "type": "Actions", "title": "Basic Actions", "description": "Everyday item handling, following, book reading, spellcasting and teaching actions of the Basic module.", "tags": ["actions", "skyrimnet", "items", "magic", "follow", "reading"], "group": "actions", "sz": 48, "body": "# Overview\n\nThe Basic module (FOMOD option \"Basic Actions\", recommended) carries the everyday verbs: picking up, giving, taking and consuming items, looting and searching containers and corpses, following the player, reading books and notes aloud, casting and teaching spells and shouts, and transferring property ownership. Each YAML declares `name`, `description`, `questEditorId: SeverActions`, a `scriptName`/`executionFunctionName` pair, `parameterMapping`, an `enabled` flag, and `eligibilityRules` built from SkyrimNet decorators (for example `is_in_combat` and `get_faction_rank`).\n\nThe module ships 20 YAMLs \u2014 18 executable actions plus 2 category files that only group actions for the AI's action menu (category files set no execution script).\n\n# Member Actions\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| bringitem.yaml | BringItem | items | SeverActions_Loot.BringItem_Execute | Fetch-and-deliver in one motion \u2014 pick up a nearby loose item and carry it to the target actor |\n| castspell.yaml | CastSpell | magic | SeverActions_SpellCast.CastSpell_Execute | Cast a known spell at a target; restoration heals auto-repeat until the target is whole or the caster runs dry |\n| cat_inventory.yaml | Items | items | \u2014 | Category file grouping item pickup, give/take, looting and reading actions |\n| cat_magic.yaml | Magic | magic | \u2014 | Category file grouping casting, teaching and shout actions |\n| giveitem.yaml | GiveItem | items | SeverActions_Loot.GiveItem_Execute | Move an item from the speaker's pack into the target's \u2014 a gift, payment or handed draught |\n| learnspell.yaml | LearnSpell | magic | SeverActions_SpellTeach.learnspell | The speaker takes a spell from the player, who must actually know it |\n| lootcontainer.yaml | LootContainer | items | SeverActions_Loot.LootContainer_Execute | Open a chest, sack, barrel, drawer or strongbox and help themselves; locked ones get a lockpicking attempt |\n| lootcorpse.yaml | LootCorpse | items | SeverActions_Loot.LootCorpse_Execute | Pull what is worth taking from a body |\n| pickupitem.yaml | PickUpItem | items | SeverActions_Loot.PickUpItem_Execute | Grab a loose item lying out in the world \u2014 dropped sword, apple, coin, flower |\n| readbook.yaml | ReadBook | items | SeverActions_Loot.ReadBook_Execute | Read a book or note aloud from the speaker's or the player's pack; continues until StopReading |\n| searchcontainer.yaml | SearchContainer | items | SeverActions_Loot.SearchContainer_Execute | Look through a container without taking anything, so the contents can be judged first |\n| searchcorpse.yaml | SearchCorpse | items | SeverActions_Loot.SearchCorpse_Execute | Pat down a body without taking anything |\n| startfollowing.yaml | StartFollowing | \u2014 | SeverActions_Follow.StartFollowing | Fall into step behind the player when asked to come along (casual follow, not companion sign-up) |\n| stopfollowing.yaml | StopFollowing | \u2014 | SeverActions_Follow.StopFollowing | Part ways and return to their own business while currently following |\n| stopreading.yaml | StopReading | items | SeverActions_Loot.StopReading_Execute | Close the book, stow it, and fall quiet |\n| takeitem.yaml | TakeItem | items | SeverActions_Loot.TakeItem_Execute | Accept an item from someone \u2014 coin counted at the bar, a key surrendered |\n| teachshout.yaml | TeachShout | magic | SeverActions_SpellTeach.TeachShout | Teach one Word of Power of a Shout the speaker themselves knows |\n| teachspell.yaml | TeachSpell | magic | SeverActions_SpellTeach.TeachSpell | Walk the player through one of the speaker's own spells |\n| transferownership.yaml | TransferOwnership | \u2014 | SeverActions_Property.TransferOwnership | Formally hand over a property to the player \u2014 deed, keys, home rights |\n| useitem.yaml | UseItem | items | SeverActions_Loot.UseItem_Execute | Consume something the speaker carries \u2014 potion, food, or a tasted ingredient |\n\n# Eligibility Notes\n\n- ReadBook and StopReading are a pair; the book's real text only surfaces after ReadBook fires (per-actor StorageUtil state read by the prompts \u2014 see [/prompts/core.md](/prompts/core.md)).\n- CastSpell routes through the animated-cast alias pipeline ([/scripts/magic-travel.md](/scripts/magic-travel.md)).\n- TransferOwnership enforces the speaker-owns-property gate in SeverActions_Property, because eligibility decorators cannot see the dynamic propertyName parameter at filter time ([/scripts/core-system.md](/scripts/core-system.md)).\n- LearnSpell and TeachSpell check the speaker's known-spell list injected by the prompts ([/prompts/core.md](/prompts/core.md)).\n- The FOMOD description for this module also mentions wait/relax verbs; those live in the Follower module's YAMLs today ([/actions/follower.md](/actions/follower.md)).\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Basic/SKSE/Plugins/SkyrimNet/config/actions/*.yaml`\n[2] `fomod/ModuleConfig.xml` \u2014 Basic Actions plugin description"}, {"id": "actions/brawl", "type": "Actions", "title": "Brawl Actions", "description": "Non-lethal fist-fight challenge, acceptance, refusal and forfeit actions of the Brawl module.", "tags": ["actions", "skyrimnet", "brawl", "fists", "non-lethal"], "group": "actions", "sz": 35, "body": "# Overview\n\nThe Brawl module (FOMOD option \"Brawl Actions\", recommended) implements ritual fist fights \u2014 challenge, accept, decline, forfeit \u2014 that end in yield or bleedout, never death. NPCs are routed through DGIntimidateFaction so brawl damage triggers bleedout instead of killing; weapons and spells are stripped for the duration and restored when the fight ends (with a v3.7.2 safety net for fights that end the wrong way). Brawls work against the player AND between any two NPCs (tavern brawls), with a non-pausing PrismaUI overlay for the player-target challenge popup. All execution functions live in SeverActions_Brawl ([/scripts/crime.md](/scripts/crime.md)).\n\nThe module ships 5 YAMLs \u2014 4 executable actions plus the cat_brawl category file.\n\n# Member Actions\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| acceptbrawl.yaml | AcceptBrawl | brawl | SeverActions_Brawl.AcceptBrawl_Execute | Answer a challenge or provocation with fists, starting the fight now |\n| cat_brawl.yaml | Brawl | brawl | \u2014 | Category file grouping the non-lethal fight actions |\n| challengebrawl.yaml | ChallengeBrawl | brawl | SeverActions_Brawl.ChallengeBrawl_Execute | Throw down the gauntlet and await the target's answer |\n| declinebrawl.yaml | DeclineBrawl | brawl | SeverActions_Brawl.DeclineBrawl_Execute | Refuse a challenge without fighting |\n| forfeitbrawl.yaml | ForfeitBrawl | brawl | SeverActions_Brawl.ForfeitBrawl_Execute | Yield and end an ongoing brawl the speaker is losing |\n\n# Mechanics\n\n- Fists only: weapons and spells are stripped for the duration; damage routes to bleedout via DGIntimidateFaction.\n- Challenge/accept flows can be driven from dialogue (ChallengeBrawl sets a pending wait state) or from the PrismaUI Actions page; akChallenger may be omitted when a challenge is already pending.\n- The brawl state prompt (0161) is composed entirely in C++ via the sever_brawl_state decorator \u2014 pending challenge, active fight, and recent-outcome memory contexts ([/prompts/situational.md](/prompts/situational.md)).\n- The v3.9.9 overhaul fixed follower sparring (NFF release-and-rejoin), opponents refusing to stay unarmed, and forfeit handling; stripped-spell recovery was added in v3.7.2.\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Brawl/SKSE/Plugins/SkyrimNet/config/actions/*.yaml`\n[2] `fomod/ModuleConfig.xml` \u2014 Brawl Actions description"}, {"id": "actions/combat", "type": "Actions", "title": "Combat Actions", "description": "Lethal attack, ceasefire, yield and outlaw-standoff actions of the Combat module.", "tags": ["actions", "skyrimnet", "combat", "outlaws", "truce"], "group": "actions", "sz": 34, "body": "# Overview\n\nThe Combat module (FOMOD option \"Combat Actions\", recommended) covers real fights \u2014 attack, stand down, surrender \u2014 plus the v3.9 outlaw-standoff verbs that give a pacified camp's challenger a verdict in dialogue. Execution functions live in SeverActions_Combat; the truce layer itself is native and its history sits in [/references/version-history.md](/references/version-history.md) (v3.9.0/v3.9.2).\n\nThe module ships 6 YAMLs \u2014 5 executable actions plus the cat_combat category file.\n\n# Member Actions\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| attacktarget.yaml | AttackTarget | combat | SeverActions_Combat.AttackTarget_Execute | Attack with weapons and start a real fight \u2014 lethal intent |\n| cat_combat.yaml | Combat | combat | \u2014 | Category file grouping attack, surrender and ceasefire actions |\n| ceasefighting.yaml | CeaseFighting | combat | SeverActions_Combat.CeaseFire_Execute | Call a truce in an ongoing fight; both combatants stand down |\n| letthempass.yaml | LetThemPass | \u2014 | SeverActions_Combat.LetThemPass_Execute | The challenger is satisfied with the player's answer and waves them through the camp for this visit |\n| runthemoff.yaml | RunThemOff | \u2014 | SeverActions_Combat.RunThemOff_Execute | Reject the stranger's answer and attack; the whole camp joins the fight |\n| yield.yaml | Yield | combat | SeverActions_Combat.Yield_Execute | Surrender a losing real fight and hope for mercy |\n\n# Eligibility Notes\n\n- AttackTarget vs ChallengeBrawl: lethal intent vs non-lethal fists. The v2.1.7 aggression side effects were reverted in v2.5 and self-healed in v2.9.5.\n- LetThemPass / RunThemOff fire only for the one outlaw who walked over to question the player (camp_challenge_pending) \u2014 see the camp challenge prompt [/prompts/core.md](/prompts/core.md).\n- The AIO flee-suppression interplay (SeverActions_AttackFaction / SeverActions_TargetFaction added during AttackTarget) lives in SeverActions_Combat and the AI Overhaul patch ([/patches/ai-overhaul.md](/patches/ai-overhaul.md)).\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Combat/SKSE/Plugins/SkyrimNet/config/actions/*.yaml`"}, {"id": "actions/crafting", "type": "Actions", "title": "Crafting Actions", "description": "Forge, alchemy, cookpot and deferred-commission actions of the Crafting module.", "tags": ["actions", "skyrimnet", "crafting", "smithing", "cooking", "commissions"], "group": "actions", "sz": 35, "body": "# Overview\n\nThe Crafting module (FOMOD option \"Crafting Actions\", optional; installs together with the Crafting prompt) has NPCs walk to a workstation and work it: smithing and smelting at the forge, potions at an alchemy lab, meals at a cookpot or spit \u2014 with the finished piece handed to whoever asked. Smiths can also take deferred commissions that mature over a few in-game days, collected later with the remaining payment. All execution functions live in SeverActions_Crafting; timing constants live in the native CraftingOrchestrator (kCraftTimeSeconds = 5).\n\nThe module ships 6 YAMLs \u2014 5 executable actions plus the cat_crafting category file.\n\n# Member Actions\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| brewpotion.yaml | BrewPotion | crafting | SeverActions_Crafting.BrewPotion_Internal | Brew a potion at an alchemy lab and hand the finished bottle to someone |\n| cat_crafting.yaml | Crafting | crafting | \u2014 | Category file grouping forge, lab, cookpot and commission actions |\n| collectcommission.yaml | CollectCommission | crafting | SeverActions_Crafting.CollectCommission_Internal | Hand over a finished workshop commission the player has come back to collect, with the remaining payment |\n| commissionitem.yaml | CommissionItem | crafting | SeverActions_Crafting.CommissionItem_Internal | Take a deferred order \u2014 ready in a few days, usually naming a timeframe and a deposit |\n| cookmeal.yaml | CookMeal | crafting | SeverActions_Crafting.CookMeal_Internal | Cook food at a cookpot or spit and serve it to someone |\n| craftitem.yaml | CraftItem | crafting | SeverActions_Crafting.CraftItem_Internal | Work the forge \u2014 hammer, tongs, quench \u2014 and hand over the finished piece on the spot |\n\n# Eligibility Notes\n\n- On-the-spot work is CraftItem / BrewPotion / CookMeal; deferred orders are CommissionItem then CollectCommission \u2014 the pairs are explicitly cross-guarded in their descriptions.\n- CollectCommission only fires when the workshop-commissions context lists the order as finished \u2014 see the Crafting prompt [/prompts/situational.md](/prompts/situational.md).\n- Crafting delivery and loot transfer scripts: [/scripts/economy-crafting.md](/scripts/economy-crafting.md).\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Crafting/SKSE/Plugins/SkyrimNet/config/actions/*.yaml`"}, {"id": "actions/economy", "type": "Actions", "title": "Economy Actions", "description": "Gold, trade, debt and extortion actions of the Economy module.", "tags": ["actions", "skyrimnet", "economy", "gold", "debt", "trade"], "group": "actions", "sz": 41, "body": "# Overview\n\nThe Economy module (FOMOD option \"Economy Actions\", optional) covers gold and debt: atomic item-for-gold trades, gifts and tips, extortion, and a full debt system with one-off tabs, recurring charges (rent, wages, dues), credit limits, due dates, and repayment or forgiveness. Execution functions split between SeverActions_Currency (coin in hand) and SeverActions_Debt (the ledger). The FOMOD description notes the debt system auto-grows from item gifts and reports severely overdue debts to guards.\n\nThe module ships 12 YAMLs \u2014 11 executable actions plus the `cat_economy` category file.\n\n# Member Actions\n\n## Coin in hand (SeverActions_Currency)\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| cat_economy.yaml | Economy | economy | \u2014 | Category file grouping all gold, trade and debt actions |\n| buyitem.yaml | BuyItem | economy | SeverActions_Currency.BuyItem_Execute | Coin one way, goods the other, settled in the same breath |\n| sellitem.yaml | SellItem | economy | SeverActions_Currency.SellItem_Execute | Goods one way, coin the other \u2014 not for finished commissions |\n| givegold.yaml | GiveGold | economy | SeverActions_Currency.GiveGold_Execute | Coin moves from the speaker to someone else \u2014 gift, tip, fee, reward, refund |\n| collectpayment.yaml | CollectPayment | economy | SeverActions_Currency.CollectPayment_Execute | Take gold owed TO the speaker; automatically reduces open debts |\n| extortgold.yaml | ExtortGold | economy | SeverActions_Currency.ExtortGold_Execute | Squeeze coin out of someone through threat or intimidation |\n| repaydebt.yaml | RepayDebt | economy | SeverActions_Currency.RepayDebt_Execute | The speaker pays back some or all of a debt THEY owe |\n\n## The ledger (SeverActions_Debt)\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| createdebt.yaml | CreateDebt | economy | SeverActions_Debt.CreateDebt_Execute | Open a one-off tab with optional due dates and credit limits |\n| createrecurringdebt.yaml | CreateRecurringDebt | economy | SeverActions_Debt.CreateRecurringDebt_Execute | Strike an ongoing arrangement where coin changes hands on a schedule |\n| addtodebt.yaml | AddToDebt | economy | SeverActions_Debt.AddToDebt_Execute | Add charges to a tab that already exists |\n| reducedebt.yaml | ReduceDebt | economy | SeverActions_Debt.ReduceDebt_Execute | Reduce a tab by agreed amount with no gold changing hands |\n| forgivedebt.yaml | ForgiveDebt | economy | SeverActions_Debt.ForgiveDebt_Execute | Cancel every debt the other person owes \u2014 all tabs at once |\n\n# Eligibility Notes\n\n- CollectPayment only ever moves gold TO the speaker; the speaker paying is GiveGold or BuyItem. Guard bounty payments deliberately route through PayNpcBountyToGuard instead ([/actions/arrest.md](/actions/arrest.md)).\n- ForgiveDebt is a deliberate act of mercy or giving up \u2014 payments settle their own debts automatically.\n- RepayDebt with amount 0 (or omitted) pays everything owed; it can never exceed the debt.\n\n# Related\n\n- Currency and Debt scripts own these ledgers: [/scripts/economy-crafting.md](/scripts/economy-crafting.md)\n- Shared wage and settlement machinery with Enterprises: [/actions/enterprises.md](/actions/enterprises.md)\n- Debt and merchant context prompts: [/prompts/economy.md](/prompts/economy.md)\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Economy/SKSE/Plugins/SkyrimNet/config/actions/*.yaml`"}, {"id": "actions/enterprises", "type": "Actions", "title": "Enterprises Actions", "description": "Hiring, wages, loans, hold taxes and outlaw-camp management actions of the Enterprises module.", "tags": ["actions", "skyrimnet", "enterprises", "employment", "loans", "taxes", "camps"], "group": "actions", "sz": 55, "body": "# Overview\n\nThe Enterprises module (FOMOD option \"Enterprises Actions\", optional) is the off-screen economy: any NPC can be hired to run a venture \u2014 a mine, a shop or trade stall, an alchemy bench, a farm, a fencing operation, a mercenary contract \u2014 and hold stewards channel every retainer's weekly take into a vault the player collects from. Wages, raises and terms are negotiable; loans flow both ways; the Imperial Fiscal Levy's Final Audit presses back-taxes; and outlaw camps can swear to the player, muster for war, or be released. Nearly every execution function lives in SeverActions_Currency; the two hired-thug verbs live in SeverActions_Travel.\n\nThe module ships 27 YAMLs \u2014 26 executable actions plus the `cat_employment` category file.\n\n# Member Actions\n\n## Hiring and service\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| cat_employment.yaml | Employment | employment | \u2014 | Category file grouping all employment and camp actions |\n| hireretainer.yaml | HireRetainer | employment | SeverActions_Currency.HireRetainer | The speaker agrees to work for the player running an off-screen venture |\n| hiresteward.yaml | HireSteward | employment | SeverActions_Currency.HireSteward | Appoint an existing retainer as STEWARD of the player's hold |\n| dismissretainer.yaml | DismissRetainer | employment | SeverActions_Currency.DismissRetainer | End a retainer's service; they stop producing and go back to normal life |\n| dismisssteward.yaml | DismissSteward | employment | SeverActions_Currency.DismissSteward | Relieve a steward; the hold vault hands itself back automatically |\n\n## Collections, wages and terms\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| collectfromretainer.yaml | CollectFromRetainer | employment | SeverActions_Currency.CollectFromRetainer | Take the earnings a retainer has been holding since last collection |\n| collectfromsteward.yaml | CollectFromSteward | employment | SeverActions_Currency.CollectFromSteward | Collect the hold's whole takings from the steward's vault in one handover |\n| payarrears.yaml | PayArrears | employment | SeverActions_Currency.PayArrears | Pay the back-wages the player owes a retainer |\n| grantretainerraise.yaml | GrantRetainerRaise | employment | SeverActions_Currency.GrantRetainerRaise | Agree to pay a retainer better; actually changes the wage or split |\n| negotiateterms.yaml | NegotiateTerms | employment | SeverActions_Currency.NegotiateTerms | Haggle \u2014 split the difference on a raise or a share |\n\n## Grievances\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| reassureretainer.yaml | ReassureRetainer | employment | SeverActions_Currency.ReassureRetainer | Sincerely hear out and genuinely address a retainer's grievance face to face |\n| brushoffretainer.yaml | BrushOffRetainer | employment | SeverActions_Currency.BrushOffRetainer | Dismiss, mock or threaten the retainer's grievance to their face |\n\n## Loans\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| grantloan.yaml | GrantLoan | employment | SeverActions_Currency.GrantLoan | Lend a retainer the coin they asked for \u2014 real money leaves the player's purse |\n| refuseloan.yaml | RefuseLoan | employment | SeverActions_Currency.RefuseLoan | Turn down a retainer's loan request |\n| forgiveloan.yaml | ForgiveLoan | employment | SeverActions_Currency.ForgiveLoan | Write off what a retainer still owes |\n\n## Hold taxes and the Final Audit\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| collectauthorizedtaxes.yaml | CollectAuthorizedTaxes | \u2014 | SeverActions_Currency.CollectAuthorizedTaxes | A Treasury collector accepts the back-taxes payment the player agreed to in dialogue |\n| granttaxrelief.yaml | GrantTaxRelief | \u2014 | SeverActions_Currency.GrantTaxRelief | A jarl genuinely persuaded in person eases the hold's enterprise taxes |\n| raiseholdtaxes.yaml | RaiseHoldTaxes | \u2014 | SeverActions_Currency.RaiseHoldTaxes | A jarl angered or unimpressed raises the hold's enterprise taxes |\n| pressthedemand.yaml | PressTheDemand | \u2014 | SeverActions_Currency.PressTheDemand | The Treasury detail escalates after the player refuses the Final Audit's demand |\n\n## Outlaw camps\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| swearcamptoplayer.yaml | SwearCampToPlayer | employment | SeverActions_Currency.SwearCampToPlayer | A camp leader agrees that their whole camp will serve the player |\n| recruitleaderlesscamp.yaml | RecruitLeaderlessCamp | employment | SeverActions_Currency.RecruitLeaderlessCamp | One voice of a leaderless camp personally throws in with the player |\n| releasecampfromservice.yaml | ReleaseCampFromService | employment | SeverActions_Currency.ReleaseCampFromService | Cut a sworn camp loose entirely; they keep their ground |\n| renouncecampoath.yaml | RenounceCampOath | employment | SeverActions_Currency.RenounceCampOath | The oath breaks after betrayal; the camp returns to ordinary outlaws |\n| mustercamp.yaml | MusterCamp | employment | SeverActions_Currency.MusterCamp | Rally the whole sworn camp to the player's side right now |\n| sendcamphome.yaml | SendCampHome | employment | SeverActions_Currency.SendCampHome | Dismiss a mustered war band back to the camp |\n\n## Hired thugs\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| thugattack.yaml | ThugAttack | employment | SeverActions_Travel.ThugAttack_Execute | The ambush pack turns to violence after a refused settlement or drawn weapon |\n| thugstanddown.yaml | ThugStandDown | employment | SeverActions_Travel.ThugStandDown_Execute | The thugs back off after being paid off, intimidated or talked down |\n\n# Related\n\n- Retainer, steward, camp and treasury state prompts: [/prompts/enterprises.md](/prompts/enterprises.md)\n- Weekly settlements, wages and arrears flow through the Currency script: [/scripts/economy-crafting.md](/scripts/economy-crafting.md)\n- Shared debt and payment machinery with the Economy module: [/actions/economy.md](/actions/economy.md)\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Enterprises/SKSE/Plugins/SkyrimNet/config/actions/*.yaml`"}, {"id": "actions/follower", "type": "Actions", "title": "Follower Actions", "description": "Companion recruitment, waiting, dismissal, homes and combat-style actions of the Follower module.", "tags": ["actions", "skyrimnet", "followers", "companions", "relationship"], "group": "actions", "sz": 39, "body": "# Overview\n\nThe Follower module (FOMOD option \"Follower Actions\", recommended) is the companion framework surface: making an NPC a registered companion, waiting and resuming, parting ways, assigning a home, tuning combat style and follow distance, and the rare relationship-driven outcome. Nearly everything executes in SeverActions_FollowerManager, with follow distance in SeverActions_Follow. Recruitment makes the NPC a proper Skyrim teammate and integrates with NFF/EFF when installed; relationship drift itself is not an action here \u2014 it is assessed by LLM background prompts.\n\nThe module ships 9 YAMLs, all executable (no category file).\n\n# Member Actions\n\n| File | Action | Script.Function | Enabled | Purpose |\n|---|---|---|---|---|\n| adjustrelationship.yaml | AdjustRelationship | SeverActions_FollowerManager.AdjustRelationship | false | Feelings shift after a meaningful moment together \u2014 shipped disabled; relationship is assessed by background prompts instead |\n| assignhome.yaml | AssignHome | SeverActions_FollowerManager.AssignHome | true | Assign the follower a home \u2014 where they head back when dismissed |\n| companionfollow.yaml | CompanionFollow | SeverActions_FollowerManager.CompanionFollow | true | A waiting companion shoulders their pack and falls back in step |\n| companionwait.yaml | CompanionWait | SeverActions_FollowerManager.CompanionWait | true | Wait here until the player returns, wandering nearby on their own business |\n| dismissfollower.yaml | DismissFollower | SeverActions_FollowerManager.DismissCompanion | true | Part ways amicably \u2014 they head home and can be re-recruited later |\n| followerleaves.yaml | FollowerLeaves | SeverActions_FollowerManager.FollowerLeaves | true | The companion quits for good after severe, sustained mistreatment (extremely rare) |\n| setcombatstyle.yaml | SetCombatStyle | SeverActions_FollowerManager.SetCombatStyle | true | How to fight from now on \u2014 hold the front, hang back at range, or keep allies healed |\n| setcompanion.yaml | SetCompanion | SeverActions_FollowerManager.RegisterFollower | true | Agree to travel with the player as a registered companion \u2014 first sign-up or re-recruit |\n| setfollowdistance.yaml | SetFollowDistance | SeverActions_Follow.SetFollowDistance | true | Trail closely (\"close\") or with comfortable travelling room (\"normal\") |\n\n# Eligibility Notes\n\n- SetCompanion (registration), CompanionFollow (resume after wait) and StartFollowing (casual follow, Basic module) are distinct verbs; DismissFollower is a parting, CompanionWait is not a farewell, FollowerLeaves only fires on collapsed relationships.\n- When NFF owns the follower, recruit/dismiss/wait/resume route through NFF's own controller (v3.9.9) \u2014 see [/references/project-overview.md](/references/project-overview.md).\n- The manager behind these verbs is documented in [/scripts/companions.md](/scripts/companions.md); companion-state prompts in [/prompts/follower.md](/prompts/follower.md).\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Follower/SKSE/Plugins/SkyrimNet/config/actions/*.yaml`"}, {"id": "actions/furniture", "type": "Actions", "title": "Furniture Actions", "description": "Sitting, lying and getting up from furniture of the Furniture module.", "tags": ["actions", "skyrimnet", "furniture", "sit", "sleep"], "group": "actions", "sz": 30, "body": "# Overview\n\nThe Furniture module (FOMOD option \"Furniture Actions\", recommended) lets NPCs use the world's furniture \u2014 chairs, benches, beds, shrines and crafting stations \u2014 with automatic cleanup handled by the native FurnitureManager. Both actions execute in SeverActions_Furniture ([/scripts/companions.md](/scripts/companions.md)); the FormID is picked from the nearby-objects list injected by the prompts.\n\nThe module ships 2 YAMLs, both executable (no category file).\n\n# Member Actions\n\n| File | Action | Script.Function | Purpose |\n|---|---|---|---|---|\n| sitorlaydown.yaml | SitOrLayDown | SeverActions_Furniture.UseFurniture_Execute | Settle onto furniture \u2014 chair, bench, bed or shrine \u2014 when they say they want to sit, rest, sleep or pray |\n| stopusingfurniture.yaml | StopUsingFurniture | SeverActions_Furniture.StopUsingFurniture_Execute | Get up from furniture they are using \u2014 push back from the chair, roll off the bed |\n\n# Eligibility Notes\n\n- Both are cross-guarded: SitOrLayDown refuses if already using furniture, StopUsingFurniture only when currently sitting, lying or kneeling.\n- Hotkey-driven furniture use (two-step pick NPC then pick furniture) lives in SeverActions_Hotkeys \u2014 [/scripts/core-system.md](/scripts/core-system.md).\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Furniture/SKSE/Plugins/SkyrimNet/config/actions/*.yaml`"}, {"id": "actions/kidnap", "type": "Actions", "title": "Kidnap & Captives Actions", "description": "Abduction, restraint, ransom and interrogation actions of the Kidnap module.", "tags": ["actions", "skyrimnet", "kidnap", "captivity", "ransom", "dark-roleplay"], "group": "actions", "sz": 38, "body": "# Overview\n\nThe Kidnap module (FOMOD option \"Kidnap and Captive Actions\", optional; dark roleplay content split out from Follower Actions so it can be opted into separately) lets companions seize, hold, move, ransom and interrogate NPCs, with real crime consequences when a grab goes witnessed. Every execution function lives in SeverActions_FollowerManager, sharing apparatus with the follower and arrest systems. The README notes kidnap is opt-in while restrain ships on.\n\nThe module ships 9 YAMLs, all executable (no category file).\n\n# Member Actions\n\n| File | Action | Script.Function | Purpose |\n|---|---|---|---|---|\n| demandransom.yaml | DemandRansom | SeverActions_FollowerManager.DemandRansom | Send a ransom demand to the captive's home hold; the answer returns by courier \u2014 payment scaled by the captive's standing, or refusal and searchers |\n| interrogatecaptive.yaml | InterrogateCaptive | SeverActions_FollowerManager.InterrogateCaptive | Press a held captive for secrets; resolve cracks and their own knowledge becomes fair game in conversation |\n| kidnapnpc.yaml | KidnapNPC | SeverActions_FollowerManager.KidnapNPC | Quietly abduct a named NPC to a named destination \u2014 bound and hooded, tied on arrival |\n| leashcaptive.yaml | LeashCaptive | SeverActions_FollowerManager.LeashCaptiveByName | Bring a held, bound captive along \u2014 hands stay tied, they walk behind you |\n| movecaptive.yaml | MoveCaptive | SeverActions_FollowerManager.MoveCaptive | Untie, march to a new location, bind again there |\n| releasecaptive.yaml | ReleaseCaptive | SeverActions_FollowerManager.ReleaseCaptive | Cut bonds and end the captivity for good |\n| restrainnpc.yaml | RestrainNPC | SeverActions_FollowerManager.RestrainNPC | Bind someone's hands and hold them standing \u2014 the lighter in-the-open variant, no crime |\n| unleashcaptive.yaml | UnleashCaptive | SeverActions_FollowerManager.UnleashCaptiveByName | Stop leading a leashed captive and hold them where they stand |\n| untiecaptive.yaml | UntieCaptive | SeverActions_FollowerManager.UntieCaptive | Loosen bonds without freeing \u2014 hood and ties off, watched but mobile |\n\n# Eligibility Notes\n\n- KidnapNPC requires an explicit player order naming both target and destination; jailed prisoners, active arrests, the player's followers and children are off-limits as targets.\n- Captives are people, not props: a held NPC knows they are bound and narrates from inside the hood; an unwatched unbound captive escapes far more easily.\n- Captive state (binding, holding, ransom status) lives in the native co-save stores \u2014 see [/systems/native-plugin.md](/systems/native-plugin.md).\n- Situation awareness for victim and kidnapper comes from the kidnap prompt in the Follower module: [/prompts/follower.md](/prompts/follower.md).\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Kidnap/SKSE/Plugins/SkyrimNet/config/actions/*.yaml`\n[2] `fomod/ModuleConfig.xml` \u2014 Kidnap and Captive Actions description"}, {"id": "actions/outfit", "type": "Actions", "title": "Outfit Actions", "description": "Equip, unequip, outfit presets and situation outfits of the Outfit module, plus the misplaced worn-equipment prompt.", "tags": ["actions", "skyrimnet", "outfit", "equipment", "presets"], "group": "actions", "sz": 38, "body": "# Overview\n\nThe Outfit module (FOMOD option \"Outfit Actions\", recommended) covers clothing and gear: putting on and taking off named items, dressing and undressing, saving the current look as a named preset, re-applying presets, and standing situation rules that automatically switch outfits for town, adventure, home or sleep. All execution functions live in SeverActions_Outfit; persistence runs through the native outfit store.\n\nThe module ships 9 YAMLs \u2014 8 executable actions plus the cat_outfit category file \u2014 and, unusually, also contains one misplaced prompt template inside its action tree.\n\n# Member Actions\n\n| File | Action | Category | Script.Function | Purpose |\n|---|---|---|---|---|\n| applyoutfitpreset.yaml | ApplyOutfitPreset | outfit | SeverActions_Outfit.ApplyOutfitPreset_Execute | Change into an outfit previously saved with SaveOutfitPreset |\n| cat_outfit.yaml | Outfit | outfit | \u2014 | Category file grouping all clothing and gear actions |\n| clearsituationoutfit.yaml | ClearSituationOutfit | outfit | SeverActions_Outfit.ClearSituationPreset_Execute | Drop the standing outfit rule for one situation |\n| equipitems.yaml | EquipArmor | outfit | SeverActions_Outfit.EquipMultipleItems_Execute | Put on one or more named items from inventory (any gear, not just armor) |\n| getdressed.yaml | GetDressed | outfit | SeverActions_Outfit.Dress_Execute | Put back on the clothes and armor removed earlier |\n| saveoutfitpreset.yaml | SaveOutfitPreset | outfit | SeverActions_Outfit.SaveOutfitPreset_Execute | Save the current look under a short name for later recall |\n| setsituationoutfit.yaml | SetSituationOutfit | outfit | SeverActions_Outfit.SetSituationPreset_Execute | Automatically change into a saved outfit whenever a situation begins |\n| undress.yaml | Undress | outfit | SeverActions_Outfit.Undress_Execute | Take off all equipped armor and clothing |\n| unequipitems.yaml | UnequipArmor | outfit | SeverActions_Outfit.UnequipMultipleItems_Execute | Take off specific worn pieces by name |\n\n# Misplaced Prompt\n\n| File | Content |\n|---|---|\n| SKSE/Plugins/SkyrimNet/prompts/submodules/character_bio/0410_equipment.prompt | Jinja render of the speaker's worn equipment (\"### Worn Equipment\"), gated by render_mode including full/thoughts/transform/equipment/action. It sits inside the Outfit action tree rather than under Prompts/; SkyrimNet still picks it up by path convention. Accounted for in this concept because it ships here. |\n\n# Related\n\n- Presets, slots and situation switching mechanics: [/scripts/outfit.md](/scripts/outfit.md)\n- Follower outfit context prompt (0415, in the Follower module): [/prompts/follower.md](/prompts/follower.md)\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Outfit/SKSE/Plugins/SkyrimNet/config/actions/*.yaml`\n[2] `sources/SeverActions/Actions/Outfit/SKSE/Plugins/SkyrimNet/prompts/submodules/character_bio/0410_equipment.prompt`"}, {"id": "actions/travel", "type": "Actions", "title": "Travel Actions", "description": "Departure, pace and cancellation actions of the Travel module.", "tags": ["actions", "skyrimnet", "travel", "off-screen"], "group": "actions", "sz": 33, "body": "# Overview\n\nThe Travel module (FOMOD option \"Travel Actions\", recommended) lets an NPC leave right now for a named destination: the trip is simulated off-screen across unloaded cells, with adjustable pace and a non-pausing confirmation popup for the player-facing variant. All execution functions live in SeverActions_Travel ([/scripts/magic-travel.md](/scripts/magic-travel.md)); speed constants mirror the native TravelSpeed enum, and the stuck-detector falls back to distance checks on VR.\n\nThe module ships 3 YAMLs, all executable (no category file).\n\n# Member Actions\n\n| File | Action | Script.Function | Purpose |\n|---|---|---|---|---|\n| canceltravel.yaml | CancelTravel | SeverActions_Travel.CancelTravel | Call off a trip decided in this conversation; the speaker stays where they are |\n| changetravelspeed.yaml | ChangeTravelSpeed | SeverActions_Travel.SetTravelSpeedNatural | Change pace during a trip already underway \u2014 urgent news, scenic stretch, dangerous road |\n| traveltoplace.yaml | TravelToPlace | SeverActions_Travel.TravelToPlace | Leave right now, on foot, for a destination \u2014 only when the trip is firmly decided |\n\n# Eligibility Notes\n\n- TravelToPlace never fires merely because a place was mentioned, remembered, or wondered about \u2014 that lesson is the v3.9.13 release theme (followers no longer march off on musings; excluded by default with a Followers-Can-Travel toggle).\n- The v3.7.1 overhaul added the wait-vs-errand parameter (greet-on-arrival vs free time) and conversational destination resolution.\n- Off-screen simulation and destination data (road network) relate to [/systems/native-plugin.md](/systems/native-plugin.md) and [/configs/data-store.md](/configs/data-store.md).\n\n# Citations\n\n[1] `sources/SeverActions/Actions/Travel/SKSE/Plugins/SkyrimNet/config/actions/*.yaml`"}, {"id": "assets/levy-armour-sets", "type": "Asset", "title": "Levy Armour Sets", "description": "Mesh and texture assets of the Imperial Fiscal Levy officer armour \u2014 General, Legate and Penitus rank sets with their shared texture families.", "tags": ["assets", "meshes", "textures", "armor", "imperial", "levy"], "group": "assets", "sz": 49, "body": "# Overview\n\n148 binary art files dress the Imperial Fiscal Levy \u2014 the Treasury's military commission whose soldiers carry the Final Audit ([/actions/enterprises.md](/actions/enterprises.md), [/prompts/enterprises.md](/prompts/enterprises.md)). Meshes sit under `Meshes/SeverActions/Levy/` in three rank folders (General 37, Legate 34, Penitus 31 \u2014 102 NIF files with 1st-person, _0/_1 weight and _Gnd ground variants); their textures are 46 DDS files under `Textures/SeverActions/Levy/` (diffuse base, `_m` environment mask, `_n` normal). Every file is named below.\n\nArt credits (README/info.xml): armour meshes and textures by **NordwarUA** (New Legion, Nexus #30468 \u2014 Base and Textures HD archives), recoloured to a Treasury livery.\n\n# Meshes \u2014 General rank (37 files, Meshes/SeverActions/Levy/General/)\n\n| Family | Files |\n|---|---|\n| Armor | ArmorOfficerF_0, ArmorOfficerF_1, ArmorOfficerM_0, ArmorOfficerM_1, ArmorOfficer_Gnd |\n| 1st-person Armor | 1stpersonArmorOfficerF_0, 1stpersonArmorOfficerF_1, 1stpersonArmorOfficerM_0, 1stpersonArmorOfficerM_1 |\n| Boots | BootsOfficerF_0, BootsOfficerF_1, BootsOfficerM_0, BootsOfficerM_1, BootsOfficer_Gnd |\n| Gauntlets | GauntletsOfficerF_0, GauntletsOfficerF_1, GauntletsOfficerM_0, GauntletsOfficerM_1, GauntletsOfficer_Gnd |\n| 1st-person Gauntlets | 1stPersonGauntletsOfficerF_0, 1stPersonGauntletsOfficerF_1, 1stPersonGauntletsOfficerM_0, 1stPersonGauntletsOfficerM_1 |\n| Cloak (spelled \"Cloack\") | CloackOfficerF_0, CloackOfficerF_1, CloackOfficerM_0, CloackOfficerM_1, CloackOfficer_Gnd |\n| Helmet | HelmetOfficer_F, HelmetOfficer_FA, HelmetOfficer_FK, HelmetOfficer_Gnd, HelmetOfficer_M, HelmetOfficer_MA, HelmetOfficer_MK, HelmetOfficer_MO |\n| Shield | ShieldOfficer |\n\n# Meshes \u2014 Legate rank (34 files, Meshes/SeverActions/Levy/Legate/)\n\n| Family | Files |\n|---|---|\n| Armor | ArmorOfficerF_0, ArmorOfficerF_1, ArmorOfficerM_0, ArmorOfficerM_1, ArmorOfficer_Gnd |\n| 1st-person Armor | 1stpersonArmorOfficerF_0, 1stpersonArmorOfficerF_1, 1stpersonArmorOfficerM_0, 1stpersonArmorOfficerM_1 |\n| Boots | BootsF_0, BootsF_1, BootsM_0, BootsM_1, Boots_Gnd |\n| Gauntlets | GauntletsF_0, GauntletsF_1, GauntletsM_0, GauntletsM_1, Gauntlets_Gnd |\n| Cloak | CloackF_0, CloackF_1, CloackM_0, CloackM_1, Cloack_Gnd |\n| Helmet | HelmetOfficer_F, HelmetOfficer_FA, HelmetOfficer_FE, HelmetOfficer_FK, HelmetOfficer_Gnd, HelmetOfficer_M, HelmetOfficer_MA, HelmetOfficer_ME, HelmetOfficer_MK, HelmetOfficer_MO |\n\nHelmet suffixes denote crests/variants: F/M female-male base, A/K/E/O crest variants, Gnd ground object.\n\n# Meshes \u2014 Penitus rank (31 files, Meshes/SeverActions/Levy/Penitus/)\n\n| Family | Files |\n|---|---|\n| Armor | ArmorPenitusF_0, ArmorPenitusF_1, ArmorPenitusM_0, ArmorPenitusM_1, ArmorPenitus_Gnd |\n| 1st-person Armor | 1stpersonArmorPenitusF_0, 1stpersonArmorPenitusF_1, 1stpersonArmorPenitusM_0, 1stpersonArmorPenitusM_1 |\n| Boots | BootsPenitusF_0, BootsPenitusF_1, BootsPenitusM_0, BootsPenitusM_1, BootsPenitus_Gnd |\n| Gauntlets | GauntletsPenitusF_0, GauntletsPenitusF_1, GauntletsPenitusM_0, GauntletsPenitusM_1, GauntletsPenitus_Gnd |\n| 1st-person Gauntlets | 1stPersonGauntletsPenitusF_0, 1stPersonGauntletsPenitusF_1, 1stPersonGauntletsPenitusM_0, 1stPersonGauntletsPenitusM_1 |\n| Cloak | PenitusCloackF_0, PenitusCloackF_1, PenitusCloackM_0, PenitusCloackM_1, PenitusCloack_Gnd |\n| Shield | PenitusShield, PenitusShieldOnBack, PenitusShieldOnBackClk |\n\n# Textures \u2014 shared Levy families (46 files, Textures/SeverActions/Levy/)\n\nNaming: `<stem>.dds` diffuse, `<stem>_m.dds` environment mask, `<stem>_n.dds` normal map. All 46 files are enumerated below.\n\n| Family stem | Files |\n|---|---|\n| impcenturion | impcenturion.dds, impcenturion_m.dds, impcenturion_n.dds |\n| imperialcloak | imperialcloak.dds, imperialcloak_m.dds, imperialcloak_n.dds |\n| imperialcloak1 | imperialcloak1.dds |\n| imperialguard | imperialguard.dds, imperialguard_m.dds, imperialguard_n.dds |\n| implegatlegs | implegatlegs.dds, implegatlegs_m.dds, implegatlegs_n.dds |\n| imppengaunt | imppengaunt.dds, imppengaunt_m.dds, imppengaunt_n.dds |\n| imppenlegs | imppenlegs.dds, imppenlegs_m.dds, imppenlegs_n.dds |\n| imppentors | imppentors.dds, imppentors_m.dds, imppentors_n.dds |\n| oficerimperail | oficerimperail.dds, oficerimperail_m.dds, oficerimperail_n.dds |\n| oficerimperailbg | oficerimperailbg.dds, oficerimperailbg_m.dds, oficerimperailbg_n.dds |\n| oficerimperailhelmet | oficerimperailhelmet.dds, oficerimperailhelmet_m.dds, oficerimperailhelmet_n.dds |\n| oficerimperailshield | oficerimperailshield.dds, oficerimperailshield_m.dds, oficerimperailshield_n.dds |\n| penitusbg | penitusbg.dds, penitusbg_m.dds, penitusbg_n.dds |\n| penituscloak | penituscloak.dds, penituscloak_m.dds, penituscloak_n.dds |\n| penitushelm | penitushelm.dds, penitushelm_m.dds, penitushelm_n.dds |\n| penitusshield | penitusshield.dds, penitusshield_m.dds, penitusshield_n.dds |\n\n# Citations\n\n[1] `sources/SeverActions/00 Core/Meshes/SeverActions/Levy/{General,Legate,Penitus}/` (102 .nif)\n[2] `sources/SeverActions/00 Core/Textures/SeverActions/Levy/*.dds` (46)\n[3] `sources/SeverActions/README.md` \u2014 Credits"}, {"id": "assets/levy-weapons", "type": "Asset", "title": "Levy Weapon Assets", "description": "Writ, ember and storm blade meshes plus their ebony-sword, scabbard and MageGlass texture sets.", "tags": ["assets", "meshes", "textures", "weapons", "swords"], "group": "assets", "sz": 33, "body": "# Overview\n\n18 binary art files make up the Levy's signature blades: the General's writ-blade in one- and two-handed meshes, and the Legates' ember and storm blades. Credits (README/info.xml): the writ-blade mesh and textures by **InsanitySorrow** (Insanity's Ebony Sword Replacer, Nexus #37645), recoloured to the Treasury livery; the Legates' blades by **billyro** (Mage Glass Sword, Nexus #38798), re-tinted storm-blue for Livia and ember for Drusilla ([/prompts/enterprises.md](/prompts/enterprises.md)). 18 files, all named below.\n\n# Meshes (4 files, Meshes/SeverActions/Levy/Weapons/)\n\n| File | Purpose |\n|---|---|\n| writblade.nif | The General's writ-blade (world model) |\n| 1stpersonwritblade.nif | Writ-blade first-person model |\n| stormblade.nif | Legate Livia's blade \u2014 re-tinted storm-blue |\n| emberblade.nif | Legate Drusilla's blade \u2014 re-tinted ember |\n\n# Textures (6 files, Textures/SeverActions/Levy/Weapons/)\n\n| File | Purpose |\n|---|---|\n| ebonysword.dds | Base diffuse (InsanitySorrow ebony sword) |\n| ebonysword_m.dds | Environment mask |\n| ebonysword_n.dds | Normal map |\n| scabbard.dds | Scabbard diffuse |\n| scabbard_m.dds | Scabbard environment mask |\n| scabbard_n.dds | Scabbard normal map |\n\n# Textures \u2014 MageGlass (8 files, Textures/SeverActions/Levy/Weapons/MageGlass/)\n\nThe billyro Mage Glass sword texture set used for the Legates' blades.\n\n| File | Purpose |\n|---|---|\n| cubemap.dds | Cubemap reflection source |\n| sword_n.dds | Blade normal map |\n| sword_s.dds | Blade specular map |\n| storm_d.dds | Storm-blue diffuse (Livia) |\n| ember_d.dds | Ember diffuse (Drusilla) |\n| scabbard_d.dds | Scabbard diffuse |\n| scabbard_n.dds | Scabbard normal map |\n| scabbard_s.dds | Scabbard specular map |\n\n# Citations\n\n[1] `sources/SeverActions/00 Core/Meshes/SeverActions/Levy/Weapons/` (4 .nif)\n[2] `sources/SeverActions/00 Core/Textures/SeverActions/Levy/Weapons/**` (14 .dds)"}, {"id": "configs/data-store", "type": "Data", "title": "Data Configs", "description": "SKSE data files \u2014 the Bio Blocks starter library, the NPC labor seed and the road network graph.", "tags": ["data", "json", "bio-blocks", "labor", "roads"], "group": "configs", "sz": 36, "body": "# Overview\n\nThree JSON data files ship under `00 Core/SKSE/Plugins/SeverActions/`: the default Bio Blocks library written into the save folder on first load, a curated labor seed for the EmploymentRegistry, and a generated road graph used by off-screen travel. 3 files are listed below.\n\n# Member Files\n\n| File | Size | Purpose |\n|---|---|---|\n| SeverActions_BioBlocks.default.json | 24,939 B | Starter library of **78 bio blocks across 7 tabs**, written into the save folder on first load so the Bio Blocks page opens filled (v3.9.13); user edits win from then on |\n| labor_curation.json | 45,212 B | Curated NPC labor seed for EmploymentRegistry |\n| road_network.json | 207,217 B | Road graph for off-screen travel |\n\n# SeverActions_BioBlocks.default.json\n\nSchema: `{ \"blocks\": [ { id, tab, title, content } ] }`. Blocks are reusable character traits (markdown content) the player can apply to any NPC. Example tabs: \"Cognitive Level\" (Uneducated, Below Average, Very Low, the overestimates-their-own-intelligence profile), \"Adventuring Behavior\" (Looter \u2014 sharp eye for valuables, loots chests and defeated foes). Rendered in bios by the 0040 bio blocks prompt ([/prompts/core.md](/prompts/core.md)); managed from the MCM page since v3.9.13.\n\n# labor_curation.json\n\n- `comment`: curation log \u2014 the 2026-08-01 pass removed self-employ/mangled/reversed-ownership rows, deduped generic-name workers, and fixed two employer names that could never resolve (Jarl Siddgeir \u2192 Siddgeir, Jarl Skald \u2192 Skald the Elder).\n- `block`: workers that must never seed the registry (heuristic false positives).\n- `assign`: authoritative worker\u2192employer edges \u2014 the nine start-of-game jarl courts (UESP-verified), famous shop/inn staff (e.g. Saadia/Mikael/Olfina Gray-Mane \u2192 Hulda @ The Bannered Mare; Sigurd \u2192 Belethor; Imedhnain \u2192 Lisbet; Lisette \u2192 Corpulus Vinius), and a reviewed vanilla draft.\n- Rows tagged `origin: \"modlist\"` come from the author's dev load order; they resolve there and drop harmlessly elsewhere. The parser ignores the tag.\n\n# road_network.json\n\n- `version: 1`; `_note`: GENERATED by `Toolkit/road_graph_builder.py` from navmesh preferred triangles \u2014 hand-curate only what generation gets wrong (per NAVM_ROAD_EXTRACTOR.md).\n- `source: \"nav_preferred_triangles.json\"`; `nodes`: id/x/y graph nodes (e.g. `{\"id\": 1, \"x\": 157504.0, \"y\": 8832.0}`) \u2014 the input side of off-screen travel pathing ([/actions/travel.md](/actions/travel.md)).\n\n# Citations\n\n[1] `sources/SeverActions/00 Core/SKSE/Plugins/SeverActions/*.json`"}, {"id": "configs/fomod-installer", "type": "Config", "title": "FOMOD Installer", "description": "Module selection installer definition (ModuleConfig.xml) and package metadata (info.xml).", "tags": ["config", "fomod", "installer", "modules"], "group": "configs", "sz": 41, "body": "# Overview\n\nTwo XML files define the FOMOD installer that mod managers present. `ModuleConfig.xml` (633 lines) installs the required `00 Core` folder and offers four install steps of optional modules; `info.xml` carries name, author, version, description and Nexus groups. 2 files are listed below.\n\n# Member Files\n\n| File | Purpose |\n|---|---|\n| fomod/ModuleConfig.xml | Installer: required files + 4 install steps (633 lines) |\n| fomod/info.xml | Name, author, version 3.9.13, long description with credits; groups Gameplay, SkyrimNet |\n\n# Install Steps (ModuleConfig.xml)\n\n## Page 1 \u2014 Action Modules (SelectAny)\n\n| Plugin | Type | Installs |\n|---|---|---|\n| Basic Actions | Recommended | Actions/Basic |\n| Travel Actions | Recommended | Actions/Travel |\n| Combat Actions | Recommended | Actions/Combat |\n| Brawl Actions | Recommended | Actions/Brawl |\n| Outfit Actions | Recommended | Actions/Outfit |\n| Furniture Actions | Recommended | Actions/Furniture |\n| Follower Actions | Recommended | Actions/Follower |\n| Economy Actions | Optional | Actions/Economy + Prompts/Economy-Core |\n| Enterprises Actions | Optional | Actions/Enterprises |\n| Crafting Actions | Optional | Actions/Crafting + Prompts/Crafting |\n| Arrest Actions | Optional | Actions/Arrest |\n| Kidnap and Captive Actions | Optional | Actions/Kidnap |\n\n## Page 2 \u2014 Prompt Modules / Context Awareness\n\n| Plugin | Type | Installs |\n|---|---|---|\n| Core Awareness Prompts | Recommended | Prompts/Core + Prompts/Enterprises |\n| NPC Familiarity & Reputation | Recommended | Prompts/Familiarity |\n| Combat Awareness Prompt | Recommended | Prompts/Combat |\n| Brawl Awareness Prompt | Recommended | Prompts/Brawl |\n| Follower Companion Prompts | Recommended | Prompts/Follower |\n| Group Meeting Awareness | Recommended | Prompts/GroupMeeting |\n| Survival Prompt | Optional | Prompts/Survival |\n| Arrest/Crime Prompts | Optional | Prompts/Arrest |\n| Merchant Prompt \u2014 Show Anywhere | Optional (SelectAtMostOne) | Prompts/Economy-Anywhere |\n| Merchant Prompt \u2014 Location Restricted | Optional (SelectAtMostOne) | Prompts/Economy-LocationOnly |\n\nThe merchant group is mutually exclusive with none; debt context is bundled with Economy Actions regardless of the choice.\n\n## Page 3 \u2014 Compatibility Patches (SelectAny)\n\n| Plugin | Installs |\n|---|---|\n| AI Overhaul Flee Patch | Patches/AI Overhaul \u2014 see [/patches/ai-overhaul.md](/patches/ai-overhaul.md) |\n| Daegon Kaekiri Outfit Patch | Patches/Daegon Kaekiri \u2014 see [/patches/daegon-kaekiri.md](/patches/daegon-kaekiri.md) |\n\n## Page 4 \u2014 Adult Content (Optional)\n\n| Group | Type | Plugins |\n|---|---|---|\n| Arousal Actions | SelectAtMostOne | OSL Aroused (Actions/Adult-OSLAroused) or SL Aroused (Actions/Adult-SLOAroused) |\n| Arousal Prompts | SelectAtMostOne | OSL Aroused (Prompts/Adult-OSLAroused) or SL Aroused (Prompts/Adult-SLOAroused) |\n| Fertility Content | SelectAny | Fertility Status Prompt (Prompts/Adult-Fertility) |\n\n# Notes\n\n- Prompt modules are separate from action modules by design; the FOMOD couples a few (Economy+debt prompt, Crafting+commission prompt, Core+Enterprises prompts).\n- The info.xml description is a v1.0-era text (\"58 actions, 25 context prompts\"); the shipped content has since grown to 125 action YAMLs and 77 prompt templates \u2014 the README and inventory counts are authoritative.\n\n# Citations\n\n[1] `sources/SeverActions/fomod/ModuleConfig.xml`\n[2] `sources/SeverActions/fomod/info.xml`"}, {"id": "configs/plugin-wiring", "type": "Config", "title": "Plugin Registration & Distribution", "description": "Main ESP, SkyrimNet plugin manifest with LLM variants, SPID custom-AI distribution and localization strings.", "tags": ["config", "esp", "skyrimnet", "spid", "localization"], "group": "configs", "sz": 41, "body": "# Overview\n\nFour files wire SeverActions into the game and into SkyrimNet: the compiled plugin, the SkyrimNet plugin manifest that also declares LLM variant routing, the SPID distribution file for custom-AI follower detection, and the localization strings. 4 files are listed below.\n\n# Member Files\n\n| File | Size | Purpose |\n|---|---|---|\n| 00 Core/SeverActions.esp | 434,207 B | Main plugin: quest aliases, packages, follow templates, 400 slot\u00d7preset outfit triplets (v2.9), Levy soldier records; dropped Dawnguard/Dragonborn masters in v3.1.1 |\n| SKSE/Plugins/SkyrimNet/config/plugins/SeverActions/manifest.yaml | \u2014 | SkyrimNet plugin registration |\n| 00 Core/SeverActions_CustomAI_DISTR.ini | \u2014 | SPID distribution of the custom-AI follower keyword |\n| 00 Core/Interface/Translations/SeverActions_english.txt | 522 B | UI strings (UTF-16) |\n\n# SkyrimNet manifest (manifest.yaml)\n\n- `plugin:` name SeverActions, version \"3.0\", description \"SkyrimNet companion / outfit / arrest / cast-spell action pack\", icon \ud83c\udf0a.\n- **LLM variants:** one named variant `sever_background` \u2014 a config bucket routing background prompts (relationship assessment, banter, off-screen life, quest awareness, reputation, inter-follower opinions) to a cheaper model than the dialogue tier.\n- **Schema fields** (all optional, category \"LLM Overrides\", empty/0 = inherit the base OpenRouter config): API Endpoint (`llm.endpoint`), API Key (`llm.api_key`), Model Name (`llm.model_name`), Temperature (`llm.temperature`, 0-2), Max Tokens (`llm.max_tokens`, 0-4096), Request Timeout seconds (`llm.timeout`, 0-120).\n- Zero behavior change for users who do not touch these settings.\n\n# Custom-AI distribution (SeverActions_CustomAI_DISTR.ini)\n\n- Distributes the `SeverActions_CustomAIFollower` keyword (FormID `0x13C78B~SeverActions.esp`) to followers with their own custom AI systems, putting SeverActions into **tracking-only mode** for them: relationship assessments, gossip, diary reading and PrismaUI visibility work, but AI packages, follow behaviour and outfit management are never overridden.\n- **SPID is optional since 3.5.1**: the mod also parses this file natively and matches followers by NAME or EditorID, so entries work without SPID (and cover renamed forks). With SPID present, both mechanisms run.\n- **Plugin-qualified names (3.9.7+)** for collision-prone common names: `Keyword = 0x13C78B~SeverActions.esp|NPCName@Plugin.esp|NPCEditorID` \u2014 the native matcher flags the name only when the NPC's defining plugin matches. Qualified entries are native-only (SPID ignores them).\n- **Shipped entries (14):** Inigo, Lucien Flavius, Auri, Sofia, Vilja, Kaidan, Kaidan (KRCE revoiced), Recorder, M'rissi, Remiel, Xelzaz, Nebarra, Gore, Katana \u2014 each with Nexus link and EditorID in a comment; the FormID must match xEdit's AddCustomAIKeyword.pas output (0x000D70 note).\n\n# Localization (SeverActions_english.txt)\n\nUTF-16 key/value pairs: `$Rapport`, `$Trust`, `$Loyalty`, `$Crime`, and the nine hold names (`$Whiterun`, `$The Rift`, `$Haafingar`, `$Eastmarch`, `$The Reach`, `$Falkreath`, `$The Pale`, `$Hjaalmarch`, `$Winterhold`).\n\n# Citations\n\n[1] `sources/SeverActions/00 Core/SeverActions.esp`\n[2] `sources/SeverActions/00 Core/SKSE/Plugins/SkyrimNet/config/plugins/SeverActions/manifest.yaml`\n[3] `sources/SeverActions/00 Core/SeverActions_CustomAI_DISTR.ini`\n[4] `sources/SeverActions/00 Core/Interface/Translations/SeverActions_english.txt`"}, {"id": "configs/pregnancy-trigger", "type": "Trigger", "title": "Pregnancy Trigger", "description": "SkyrimNet trigger YAML that fires the Abort Pregnancy narration when the spell is applied.", "tags": ["trigger", "skyrimnet", "adult", "fertility"], "group": "configs", "sz": 30, "body": "# Overview\n\nThis is the bundle's only SkyrimNet **trigger** (distinct from action YAMLs): it fires a narration event when a spell effect is applied, rather than declaring an action the AI may choose. It supports the Fertility Mode integration's pregnancy endings. 1 file is listed below.\n\n# Member Files\n\n| File | Purpose |\n|---|---|\n| Triggers/Adult/SKSE/Plugins/SkyrimNet/config/triggers/Abort Pregnancy.yaml | Fires when the Abort Pregnancy spell is cast on a target, ending the pregnancy \u2014 with or without the target's consent |\n\n# Definition\n\n| Field | Value |\n|---|---|\n| name | \"Abort Pregnancy\" |\n| eventCriteria.eventType | active_effect |\n| schemaConditions | effect equals \"Abort Pregnancy\" (case-insensitive); action equals \"applied\" |\n| response.type | direct_narration |\n| response.content | \"{{ player.name }} casts a spell on {{ event_json.target }}, ending the pregnancy.\" |\n| audience | target |\n| enabled | true |\n| probability | 1 |\n| cooldownSeconds | 30 |\n| priority | 1 |\n\n# Related\n\n- The Fertility status prompt that makes NPCs aware of fertility/pregnancy state: [/prompts/adult.md](/prompts/adult.md)\n- The Fertility Mode bridge script feeding the data: [/scripts/magic-travel.md](/scripts/magic-travel.md)\n\n# Citations\n\n[1] `sources/SeverActions/Triggers/Adult/SKSE/Plugins/SkyrimNet/config/triggers/Abort Pregnancy.yaml`"}, {"id": "patches/ai-overhaul", "type": "Patch", "title": "AI Overhaul Patch", "description": "Compatibility ESP patching AI Overhaul's flee packages for followers and forced combat.", "tags": ["patch", "ai-overhaul", "combat", "compatibility"], "group": "patches", "sz": 32, "body": "# Overview\n\nAI Overhaul gives most civilian NPCs flee packages that trigger during any nearby combat, which makes recruited civilian followers run instead of fight and lets AttackTarget targets flee instead of fighting back. This optional FOMOD patch (\"AI Overhaul Flee Patch\") adds conditions to **all 7 AIO flee packages** so forced-combat participants hold their ground. 1 file is listed below.\n\n# Member Files\n\n| File | Purpose |\n|---|---|\n| AIO-SeverActions-Patch.esp | Conditions all 7 AI Overhaul flee packages |\n\n# Behaviour\n\n- **SeverActions followers are fully exempt** \u2014 they never flee.\n- **NPCs in forced combat (AttackTarget) are exempt while fighting** \u2014 this interlocks with the SeverActions_AttackFaction / SeverActions_TargetFaction factions that SeverActions_Combat adds to attacker and target during AttackTarget and removes via RestoreOriginalValues when combat ends ([/scripts/crime.md](/scripts/crime.md)).\n- All other NPCs keep their normal flee behaviour.\n- Requires AI Overhaul SSE (any version); optional FOMOD pick installing at priority 2.\n\n# History\n\n- v2.5 rebuilt this patch against the user's actual AI Overhaul ESP after the first version was generated against a different AIO variant and carried two \"ghost\" override records \u2014 see [/references/version-history.md](/references/version-history.md).\n- The v2.5 cowering regression hunt also reverted the 2.1.7 confidence/aggression changes made in PrepareForCombat, keeping only the faction add/remove logic this patch consumes.\n\n# Citations\n\n[1] `sources/SeverActions/Patches/AI Overhaul/AIO-SeverActions-Patch.esp`\n[2] `fomod/ModuleConfig.xml` \u2014 AI Overhaul Flee Patch description"}, {"id": "patches/daegon-kaekiri", "type": "Patch", "title": "Daegon Kaekiri Patch", "description": "Script-only compatibility patch letting SeverActions manage Daegon Kaekiri's outfit against her mod's enforcement system.", "tags": ["patch", "papyrus", "outfit", "daegon-kaekiri", "followers"], "group": "patches", "sz": 43, "body": "# Overview\n\nDaegon Kaekiri (by Kukielle, Nexus 112097) ships a custom outfit enforcement system that forcibly re-equips her default outfit on every load and blocks unequips with `preventRemoval=True` \u2014 silently defeating SeverActions' Undress/Equip/Preset actions. This optional FOMOD patch (\"Daegon Kaekiri Outfit Patch\") replaces two of her scripts so the enforcement hooks back off when she is a tracked SeverActions follower. Pure Papyrus script override \u2014 no ESP, no new master. All 10 shipped files are listed below.\n\n# Member Files\n\n| File | Purpose |\n|---|---|\n| README.md | Patch documentation (root cause, fix, install, verification) |\n| Scripts/k101PlayerAliasLoaderScript.pex | Replaced compiled script \u2014 Initialize() no longer re-equips the default outfit when Daegon is a SeverActions follower |\n| Scripts/k101DaegonQuestAliasScript.pex | Replaced compiled script \u2014 OnItemRemoved/OnObjectUnequipped no longer force-restore outfit pieces |\n| Source/Scripts/k101DaegonQuestAliasScript.psc | Modified source \u2014 carries the IsSeverActionsFollower() check and change notes |\n| Source/Scripts/k101PlayerAliasLoaderScript.psc | Modified source \u2014 same runtime check on the player alias Initialize path |\n| Source/Scripts/k101DaegonController.psc | Decompiled dependency, included to satisfy the compiler (unmodified) |\n| Source/Scripts/k101DaegonCustomOutfitContainerScript.psc | Decompiled dependency (unmodified) |\n| Source/Scripts/k101DaeHugScript.psc | Decompiled dependency (unmodified) |\n| Source/Scripts/k101DaegonUtilityScript.psc | Decompiled dependency (unmodified) |\n| Source/Scripts/ww42hugfollowerscript.psc | Compile-time stub for the \"I'm Glad You're Here\" hook \u2014 never deploy its .pex |\n\n# Root Cause (per README)\n\n| Script | Hook | Behaviour |\n|---|---|---|\n| k101PlayerAliasLoaderScript::Initialize() | OnPlayerLoadGame + OnInit | Calls EquipCustomOutfit() on every load \u2014 re-applies default clothes |\n| k101DaegonQuestAliasScript::OnItemRemoved | Piece removed | Adds it back and re-equips with preventRemoval=True + notification |\n| k101DaegonQuestAliasScript::OnObjectUnequipped | Piece unequipped | Re-equips immediately with preventRemoval=True |\n\nThe `preventRemoval=True` flag silently defeats UnequipItem \u2014 the engine holds the lock.\n\n# Fix\n\nBoth replaced scripts call a helper `IsSeverActionsFollower()` that resolves **SeverActions_FollowerFaction (FormID 0x000EB708 in SeverActions.esp)** at runtime via `Game.GetFormFromFile(...)`:\n\n- SeverActions not installed \u2192 lookup returns None, original behaviour unchanged.\n- Daegon not a tracked SeverActions follower \u2192 same; her custom outfit system keeps working.\n- Daegon tracked as a SeverActions follower \u2192 the three enforcement hooks back off and SeverActions owns her outfit.\n\nNo new master is required.\n\n# Known Limitation \u2014 Brawls\n\nThe patch does NOT cleanly fix brawls against Daegon: her outfit enforcement re-equips her dagger faster than SeverActions can strip it, through a script path not yet understood. SeverActions instead auto-detects the re-equip war after 3 attempts and whitelists her dagger for that brawl \u2014 she fights with her dagger, but the brawl still resolves through DGIntimidateFaction bleedout routing ([/actions/brawl.md](/actions/brawl.md)).\n\n# Installation & Verification\n\n- Install AFTER Daegon Kaekiri (higher MO2 priority); file priority resolves the override, not plugin load order.\n- In-game check: Undress strips all armor; save+reload keeps her undressed; no \"part of Dae's custom outfit\" notifications while SeverActions manipulates her equipment.\n- Uninstall by deleting the two replaced `.pex` files \u2014 the originals take over on next load.\n\n# Related\n\n- Outfit machinery being unblocked: [/scripts/outfit.md](/scripts/outfit.md), [/actions/outfit.md](/actions/outfit.md)\n\n# Citations\n\n[1] `sources/SeverActions/Patches/Daegon Kaekiri/README.md`\n[2] `sources/SeverActions/Patches/Daegon Kaekiri/**`"}, {"id": "prompts/adult", "type": "Prompt", "title": "Adult Prompts", "description": "Arousal and fertility context prompts for the three optional adult integrations.", "tags": ["prompts", "skyrimnet", "adult", "arousal", "fertility", "osl", "sexlab"], "group": "prompts", "sz": 33, "body": "# Overview\n\nThe optional Adult prompts ship as three separate FOMOD variants, one per framework integration \u2014 OSL Aroused, SexLab Aroused (SLO), and Fertility Mode Reloaded. Each injects the framework's live state into character_bio so the AI knows about arousal or pregnancy rather than inventing it. They pair with the arousal actions in [/actions/adult.md](/actions/adult.md). All three templates are listed below.\n\n# Member Prompts\n\n| Module | File | Lines | Purpose |\n|---|---|---|---|\n| Adult-OSLAroused | submodules/character_bio/0150_severactions_oslarousal.prompt | 102 | OSL arousal state in the actor's bio; render_mode gate documented as MUST stay on line 1 |\n| Adult-SLOAroused | submodules/character_bio/0155_severactions_sloarousal.prompt | 95 | SexLab Aroused state in the actor's bio; same first-5-lines gate note |\n| Adult-Fertility | submodules/character_bio/0250_severactions_fertility.prompt | 113 | Fertility Mode Reloaded integration; carries a TONE CONTRACT comment from a field report fixing over-narration |\n\n# Notes\n\n- The OSL/SLO templates both document the SkyrimNet PromptEngine constraint in comments: only the FIRST 5 LINES of a character_bio submodule are scanned, requiring both the literal 'render_mode' and a '{% if' there.\n- The fertility prompt is gated to render only in relevant render modes (full/thoughts/transform/dialogue_target/target).\n- The paired Abort Pregnancy SkyrimNet trigger is documented in [/configs/pregnancy-trigger.md](/configs/pregnancy-trigger.md).\n- None of these do anything without the corresponding framework installed; all three are optional FOMOD picks.\n\n# Citations\n\n[1] `sources/SeverActions/Prompts/Adult-OSLAroused/.../0150_severactions_oslarousal.prompt`\n[2] `sources/SeverActions/Prompts/Adult-SLOAroused/.../0155_severactions_sloarousal.prompt`\n[3] `sources/SeverActions/Prompts/Adult-Fertility/.../0250_severactions_fertility.prompt`"}, {"id": "prompts/arrest", "type": "Prompt", "title": "Arrest Prompts", "description": "Bounty, jail, persuasion, judgment, dispatch and escort state prompts of the Arrest module.", "tags": ["prompts", "skyrimnet", "arrest", "bounty", "jail", "dispatch"], "group": "prompts", "sz": 33, "body": "# Overview\n\nThe Arrest prompt module (FOMOD option \"Arrest Prompts\") gives guards, prisoners and authorities their legal state. A base template (0275) covers normal-mode bounty awareness for any guard; the four 0276-0279 templates were extracted from it in the prompt-split refactor and handle the four active arrest flows \u2014 persuasion, judgment, cross-cell dispatch, and same-cell arrest in progress. One template (0165) adds jail-time awareness for imprisoned NPCs. All six are listed below.\n\n# Member Prompts\n\n| File | Lines | Purpose |\n|---|---|---|\n| 0165_severactions_jailed.prompt | 43 | Imprisonment awareness for jailed NPCs |\n| 0275_severactions_bounty.prompt | 118 | Normal-mode bounty + debt awareness for any guard; fires only when no global active-arrest state exists |\n| 0276_severactions_persuasion_active.prompt | 52 | Active bounty-persuasion confrontation; fires only on the confronting guard |\n| 0277_severactions_judgment_active.prompt | 137 | Active judgment hold (Phase 6) with three sub-cases: presiding sender, dispatch guard, accused prisoner |\n| 0278_severactions_dispatch_active.prompt | 173 | Active cross-cell dispatch (phases 1-5) for the dispatch guard and the prisoner during escort |\n| 0279_severactions_arrest_in_progress.prompt | 126 | Same-cell arrest in progress \u2014 ArrestState 1=approach, 2=cuffing, 3=escort, 4=escort plea |\n\n# Notes\n\n- State semantics are documented in template comments: DispatchPhase (cross-cell) is distinct from ArrestState 1..4 (same-cell).\n- These prompts pair with the arrest actions ([/actions/arrest.md](/actions/arrest.md)) and the crime scripts ([/scripts/crime.md](/scripts/crime.md)).\n- Several were extracted from 0275 during the prompt-split refactor; each keeps the render_mode gate on line 1.\n\n# Citations\n\n[1] `sources/SeverActions/Prompts/Arrest/SKSE/Plugins/SkyrimNet/prompts/submodules/character_bio/*.prompt`"}, {"id": "prompts/core", "type": "Prompt", "title": "Core Prompts", "description": "Core context-injection templates covering state, spells, gold, inventory, surroundings, reading, truce and camp context, trespass, bio blocks and embedded actions.", "tags": ["prompts", "skyrimnet", "jinja", "character-bio", "context", "core"], "group": "prompts", "sz": 48, "body": "# Overview\n\nThe Core prompt module (FOMOD option \"Core Awareness Prompts\", recommended, installed together with the Enterprises prompts) is the largest awareness surface: it tells the AI what the speaker and the player carry, know, and see, and renders the outlaw truce/camp layer that makes conversation with outlaws possible. Fifteen files live under `Prompts/Core/SKSE/Plugins/SkyrimNet/prompts/`; two more core-level templates ship under `00 Core/SKSE/Plugins/SkyrimNet/prompts/` (bio blocks and trespass). All are Jinja templates rendered into SkyrimNet's prompt stack; character_bio submodules must keep their render_mode gate within the first 5 lines (SkyrimNet's PromptEngine validator).\n\n17 templates total; every one is listed below.\n\n# Member Prompts\n\n## Module tree \u2014 system-level prompts\n\n| File | Lines | Purpose |\n|---|---|---|\n| sever_letter_writer.prompt | 40 | System prompt ghost-writing a single hand-written in-world letter (courier letters feature); renders the setting submodule and outputs ONLY a JSON object |\n\n## Module tree \u2014 character_bio submodules\n\n| File | Lines | Purpose |\n|---|---|---|\n| submodules/character_bio/0012_severactions_action_header.prompt | 22 | Renders \"## {{ me.name }}'s Current State\" (gender, race, \u2026) in action render mode |\n| submodules/character_bio/0035_severactions_knownspells.prompt | 47 | Known-spell list via get_spell_list, first-person render |\n| submodules/character_bio/0085_severactions_gold.prompt | 7 | \"## Gold\" \u2014 the actor's carried gold |\n| submodules/character_bio/0095_severactions_inventory.prompt | 20 | Actor inventory and worn equipment via get_inventory / get_worn_equipment |\n| submodules/character_bio/0096_severactions_player_inventory.prompt | 77 | Player inventory for NPC eyes \u2014 categorized, top 15 per type, nameless items filtered |\n| submodules/character_bio/0180_severactions_nearbyref.prompt | 69 | Nearby objects, flora and furniture for full/static render modes |\n| submodules/character_bio/0181_severactions_nearbyref_action.prompt | 82 | Sibling of 0180 for action render mode |\n| submodules/character_bio/0185_severactions_gossip.prompt | 20 | Local gossip \u2014 what has been happening around town |\n| submodules/character_bio/0186_severactions_truce.prompt | 81 | Outlaw truce context via sever_truce; returns \"\" for everyone else so it costs nothing normally |\n| submodules/character_bio/0187_severactions_camp.prompt | 44 | Camp leadership context via sever_camp \u2014 who leads this outlaw's camp and what that means for how they talk; leader-dead line conditional on actual state |\n| submodules/character_bio/0188_severactions_war_band.prompt | 18 | The armed company at the player's back, shown to BYSTANDERS only via sever_war_band |\n| submodules/character_bio/0189_severactions_camp_challenge.prompt | 25 | Shown ONLY to the one outlaw who walked over to question the player (camp_challenge_pending = \"1\" for exactly that actor) |\n| submodules/character_bio/0280_severactions_readbook.prompt | 65 | Book-reading mode; per-actor title/text live in StorageUtil via papyrus_util, keeping book text out of the cosave |\n\n## Module tree \u2014 user_final_instructions submodules\n\n| File | Lines | Purpose |\n|---|---|---|\n| submodules/user_final_instructions/0750_embedded_actions.prompt | 19 | When actions are embedded in dialogue, lists eligible actions and mandates the output format: dialogue FIRST, then one action on a separate line |\n\n## Core-level (00 Core/SKSE/Plugins/SkyrimNet/prompts/)\n\n| File | Lines | Purpose |\n|---|---|---|\n| submodules/character_bio/0040_severactions_bio_blocks.prompt | 15 | Renders the custom_bio_blocks decorator \u2014 every user-authored Bio Blocks library block applied to this character as \"### Title\" sections (issue #425) |\n| submodules/character_bio/0176_severactions_trespass.prompt | 14 | Injected while this actor has a live suppressed-trespass episode (native TrespassMonitor denied the vanilla warn-follow package and recorded them instead) \u2014 the v3.7.1 LLM-driven trespass flow |\n\n# Conventions\n\n- Decorators return \"\" for uninvolved actors, so most templates render nothing and c
