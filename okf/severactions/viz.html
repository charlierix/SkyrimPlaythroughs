ost no tokens outside their situations.\n- The render_mode gate MUST stay on line 1 (before comments) \u2014 SkyrimNet scans only the first 5 lines of a character_bio submodule and requires both the literal 'render_mode' and a '{% if' there.\n- Bio Blocks starter library data: [/configs/data-store.md](/configs/data-store.md). Trespass monitoring is native: [/systems/native-plugin.md](/systems/native-plugin.md).\n\n# Citations\n\n[1] `sources/SeverActions/Prompts/Core/SKSE/Plugins/SkyrimNet/prompts/**`\n[2] `sources/SeverActions/00 Core/SKSE/Plugins/SkyrimNet/prompts/submodules/character_bio/0040_severactions_bio_blocks.prompt`\n[3] `sources/SeverActions/00 Core/SKSE/Plugins/SkyrimNet/prompts/submodules/character_bio/0176_severactions_trespass.prompt`"}, {"id": "prompts/economy", "type": "Prompt", "title": "Economy Prompts", "description": "Debt and merchant context prompts in the three scoping variants of the Economy prompt modules.", "tags": ["prompts", "skyrimnet", "economy", "debt", "merchants"], "group": "prompts", "sz": 33, "body": "# Overview\n\nThe Economy prompts ship as three separate FOMOD variants that scope merchant awareness differently \u2014 Economy-Core (system-level debt context), Economy-Anywhere (merchant stock shown anywhere), and Economy-LocationOnly (merchant stock only at the shop). Together they let the AI know about outstanding debts and what a merchant actually has in stock. All three templates are listed below.\n\n# Member Prompts\n\n| Module | File | Lines | Purpose |\n|---|---|---|---|\n| Economy-Core | submodules/system_head/0150_debt_context.prompt | 11 | Financial Obligations block via the debt_context decorator \u2014 rendered only when the NPC is involved in a debt |\n| Economy-Anywhere | submodules/character_bio/0075_severactions_merchant.prompt | 35 | Merchant stock awareness for any non-player actor, gated by render_mode including action (buy/sell/vendor drill-downs) |\n| Economy-LocationOnly | submodules/character_bio/0080_severactions_merchantloc.prompt | 151 | Location-scoped variant of the merchant prompt with fuller stock and vendor logic |\n\n# Notes\n\n- Both merchant variants exclude the player and check the SexLab-animating faction to avoid awkward overrides during animations.\n- Debt actions live in [/actions/economy.md](/actions/economy.md); the ledger script is [/scripts/economy-crafting.md](/scripts/economy-crafting.md).\n- The FOMOD Economy Actions plugin installs Actions/Economy together with Prompts/Economy-Core.\n\n# Citations\n\n[1] `sources/SeverActions/Prompts/Economy-Core/SKSE/Plugins/SkyrimNet/prompts/submodules/system_head/0150_debt_context.prompt`\n[2] `sources/SeverActions/Prompts/Economy-Anywhere/SKSE/Plugins/SkyrimNet/prompts/submodules/character_bio/0075_severactions_merchant.prompt`\n[3] `sources/SeverActions/Prompts/Economy-LocationOnly/SKSE/Plugins/SkyrimNet/prompts/submodules/character_bio/0080_severactions_merchantloc.prompt`"}, {"id": "prompts/enterprises", "type": "Prompt", "title": "Enterprises Prompts", "description": "Retainer, steward, camp, treasury and Imperial Fiscal Levy character prompts of the Enterprises module.", "tags": ["prompts", "skyrimnet", "enterprises", "employment", "taxes", "npcs"], "group": "prompts", "sz": 48, "body": "# Overview\n\nThe Enterprises prompt module (FOMOD option \"Core Awareness Prompts\", installed together with Prompts/Core) is the biggest prompt group: 23 templates across three kinds. Seven character_bio submodules inject the player's retainer roster, individual employment state, grievances and hearings, the NPC labor market, hold taxes and the Final Audit. One system prompt (sever_retainer_worklife) generates each retainer's weekly off-screen work diary. Fifteen character bios define the Imperial Fiscal Levy \u2014 the Treasury's twelve-soldier military commission and its command \u2014 as SkyrimNet original_prompts.\n\n# Member Prompts\n\n## Retainer and enterprise state (character_bio submodules)\n\n| File | Lines | Purpose |\n|---|---|---|\n| 0168_severactions_retainer.prompt | 57 | Surfaces an NPC's employment as one of the player's retainers \u2014 job, pay, mood \u2014 via retainer_status (\"\" for non-retainers) |\n| 0169_severactions_enterprises_summary.prompt | 13 | The player's roster summary, rendered on the PLAYER's own bio so NPCs can reference how the businesses are doing |\n| 0169_severactions_retainer_hearing.prompt | 31 | A retainer's grievance about working for the player and the hearing flow when the player sent word to talk it out \u2014 mirrors the arrest persuasion block |\n| 0171_severactions_npc_employment.prompt | 20 | The NPC labor market: this NPC's own employer (npc_employer) or the workforce they employ (npc_workforce) |\n| 0172_severactions_hold_taxes.prompt | 11 | Hold enterprise tax rate via hold_tax_rate |\n| 0173_severactions_final_audit.prompt | 33 | The Final Audit context \u2014 is this actor one of the Treasury collectors (is_tax_collector) |\n| 0174_severactions_final_audit_court.prompt | 26 | Final Audit court context \u2014 collector plus authority flags for guards and jarls |\n\nNote: two files share the 0169 sequence number; both are listed explicitly above.\n\n## System prompt\n\n| File | Lines | Purpose |\n|---|---|---|\n| sever_retainer_worklife.prompt | 191 | System prompt helping a retainer write a condensed first-person weekly work journal (3-5 sentences) about the venture they run for the player; honors the user-configured world setting/tone submodule |\n\n## Imperial Fiscal Levy character bios (original_prompts/characters/)\n\nEach file defines SkyrimNet `{% block %}` fields \u2014 summary, interject_summary, background, personality \u2014 for one named soldier of the Levy.\n\n| File | Character | Role / post |\n|---|---|---|\n| general_cassius_vero_c09.prompt | General Cassius Vero | Commander of the Levy and the Final Audit; Bravil canal-quarter origin |\n| legate_livia_aquillia_c0a.prompt | Legate Livia Aquillia | The Audit's mind \u2014 counting-house storm-mage, second to the General |\n| legate_drusilla_metella_c0b.prompt | Legate Drusilla Metella | The Audit's silence \u2014 pulled from a Bravil canal the night a crooked collector burned her family out |\n| optio_sabina_prisca_c20.prompt | Optio Sabina Prisca | Senior NCO; Chorrol road-warden's daughter; fairness as procedure |\n| decanus_aranwe_fidelis_c22.prompt | Decanus Aranwe Fidelis | Front rank, Whiterun; the one Altmer, carries a shield, believes in the writ |\n| decanus_numerius_silo_c2a.prompt | Decanus Numerius Silo | Legion sapper, Morthal; Colovian bridge-wright family |\n| decanus_postumus_varro_c24.prompt | Decanus Postumus Varro | Front rank, Solitude; born on the Nibenese roads after his father died on them |\n| decanus_aemilia_ruso_c26.prompt | Decanus Aemilia Ruso | Shield of the Markarth pair; Skingrad stonemason's daughter |\n| decanus_torvald_falco_c28.prompt | Decanus Torvald Falco | Falkreath patrol; Bruma-born Nord first posted north |\n| battlemage_ancel_vaugier_c21.prompt | Battlemage Ancel Vaugier | Frost-caster, Whiterun daylight patrol; Wayrest contracts-and-no-hands family |\n| battlemage_nadir_sarran_c23.prompt | Battlemage Nadir Sarran | Whiterun patrol physician; Sentinel Forebear surgery family |\n| battlemage_tullia_bassa_c25.prompt | Battlemage Tullia Bassa | Solitude patrol; Legion paymaster's clerk turned caster |\n| battlemage_decimus_curio_c27.prompt | Battlemage Decimus Curio | Markarth pair caster; Imperial City street conjuror |\n| battlemage_junia_merula_c29.prompt | Battlemage Junia Merula | Strongest raw caster in the detail, least interested in it; Gold Coast anchorage upbringing |\n| battlemage_herennia_nepos_c2b.prompt | Battlemage Herennia Nepos | The detail's correspondent and Morthal caster; Cheydinhal chapel scriptorium |\n\n# Related\n\n- The hiring, wages and camp actions these prompts give state to: [/actions/enterprises.md](/actions/enterprises.md)\n- Hold stewards and collections flow through Currency: [/scripts/economy-crafting.md](/scripts/economy-crafting.md)\n\n# Citations\n\n[1] `sources/SeverActions/Prompts/Enterprises/SKSE/Plugins/SkyrimNet/prompts/**`\n[2] `sources/SeverActions/Prompts/Enterprises/SKSE/Plugins/SkyrimNet/original_prompts/characters/*.prompt`"}, {"id": "prompts/familiarity", "type": "Prompt", "title": "Familiarity Prompts", "description": "Familiarity, reputation, intimacy stance and consent prompts of the Familiarity module.", "tags": ["prompts", "skyrimnet", "familiarity", "reputation", "memory"], "group": "prompts", "sz": 33, "body": "# Overview\n\nThe Familiarity prompt module (FOMOD option \"NPC Familiarity & Reputation\", recommended) controls what NPCs know about the player: personal familiarity tiers built from actual dialogue history, name awareness (NPCs only use your name once they have heard it), guild and quest reputation spread by social role, and \u2014 when an adult framework is present \u2014 a consent-aware intimacy stance. Two character_bio submodules render knowledge into bios; two system prompts are internal assessment calls that write stance/impression state. All four are listed below.\n\n# Member Prompts\n\n| File | Lines | Purpose |\n|---|---|---|\n| submodules/character_bio/0045_severactions_familiarity.prompt | 276 | What this NPC knows about the player \u2014 familiarity tier + interactions + lastSeenDaysAgo plus the LLM-generated per-NPC blurb regenerated on first dialogue and every 100 lines |\n| submodules/character_bio/0046_severactions_intimacy_consent.prompt | 58 | How open this NPC is to the player's advances \u2014 dialogue- and event-driven stance from sever_intimacy_stance (IntimacyStanceStore) |\n| sever_intimacy_assess.prompt | 68 | Internal stance-assessment system deciding how open ONE NPC currently is to intimacy, based only on what actually happened |\n| sever_reputation_assess.prompt | 134 | Internal impression-assessment producing a brief inner monologue of how an NPC perceives a person |\n\n# Notes\n\n- The v2.2 rewrite merged the old separate familiarity and reputation prompts into one What-You-Know block; v3.9.13 added the manual blurb update button and stopped showing raw interaction tallies to the LLM.\n- Intimate history (encounter counts, consensuality) integrates with SexLab/OStim when installed; nothing explicit is stored.\n- Assessment calls are background prompts (sever_background variant) \u2014 see [/configs/plugin-wiring.md](/configs/plugin-wiring.md).\n\n# Citations\n\n[1] `sources/SeverActions/Prompts/Familiarity/SKSE/Plugins/SkyrimNet/prompts/**`"}, {"id": "prompts/follower", "type": "Prompt", "title": "Follower Prompts", "description": "Companion framework prompts \u2014 banter, ambient actions, off-screen life, relationships, quest awareness and companion bio context.", "tags": ["prompts", "skyrimnet", "followers", "companions", "banter", "off-screen-life"], "group": "prompts", "sz": 40, "body": "# Overview\n\nThe Follower prompt module (FOMOD option \"Follower Prompts\") is the LLM side of the companion framework: eight system-level prompts run as background LLM jobs (routed through the sever_background variant) \u2014 banter direction, ambient action direction, off-screen life simulation, relationship and quest assessments \u2014 while six character_bio submodules inject companion state, kidnap situations, conversation discipline and outfit context into dialogue. All 14 templates are listed below.\n\n# Member Prompts\n\n## System-level (background LLM calls)\n\n| File | Lines | Purpose |\n|---|---|---|\n| sever_follower_banter.prompt | 199 | Banter director deciding whether two companions should spontaneously talk, and who speaks to whom |\n| sever_ambient_banter.prompt | 204 | Ambient banter director for two nearby NON-follower NPCs (already filtered for combat/hostility/follower status) |\n| sever_ambient_action_director.prompt | 93 | Decides whether ONE nearby non-follower NPC should spontaneously DO something right now |\n| sever_action_adjudicator.prompt | 34 | Adjudicates whether an NPC's just-announced plan should actually proceed based on the short conversation it started |\n| sever_offscreen_life.prompt | 285 | Internal life simulation for a dismissed companion living at their assigned home while the player is away |\n| sever_quest_awareness.prompt | 64 | Writes a brief quest-awareness note for a companion; the New Objective field is a game mechanic, never quoted as spoken text |\n| sever_relationship_assess.prompt | 126 | Analyzes recent events and outputs a JSON object for how a companion's feelings should change |\n| sever_relationship_interfollower.prompt | 164 | Inter-companion assessment \u2014 how companions feel about EACH OTHER from recent interactions |\n\n## character_bio submodules\n\n| File | Lines | Purpose |\n|---|---|---|\n| 0175_severactions_follower.prompt | 95 | Follower framework \u2014 relationship, role and behavioral context |\n| 0176_severactions_offscreen_life.prompt | 32 | What a dismissed follower did while the player was away |\n| 0177_severactions_quest_awareness.prompt | 14 | What this follower knows about the player's quests |\n| 0178_severactions_kidnap.prompt | 12 | Kidnap situation awareness for victim (seized/hooded) or kidnapper (on the job); empty for uninvolved actors |\n| 0179_severactions_conversation_discipline.prompt | 25 | Group-conversation discipline fixing mis-addressing and speaker-ambiguity in multi-companion scenes |\n| 0415_outfit_context.prompt | 13 | What the follower is wearing and their situation presets |\n\n# Notes\n\n- Background prompts (banter, off-screen life, relationship, quest awareness) route through the `sever_background` LLM variant declared in the SkyrimNet plugin manifest, so users can run them on a cheaper model than dialogue \u2014 see [/configs/plugin-wiring.md](/configs/plugin-wiring.md).\n- Off-screen life summaries become memories the dismissed follower can tell you about when re-recruited (v1.8/2.0 lineage; the companion framework is documented in [/scripts/companions.md](/scripts/companions.md)).\n- Companion actions themselves: [/actions/follower.md](/actions/follower.md).\n\n# Citations\n\n[1] `sources/SeverActions/Prompts/Follower/SKSE/Plugins/SkyrimNet/prompts/**`"}, {"id": "prompts/situational", "type": "Prompt", "title": "Situational Prompts", "description": "Single-prompt modules covering brawl state, combat state, crafting commissions, group meetings and survival needs.", "tags": ["prompts", "skyrimnet", "combat", "brawl", "crafting", "survival", "group"], "group": "prompts", "sz": 36, "body": "# Overview\n\nFive prompt modules ship exactly one template each, covering distinct situations: brawl awareness (composed entirely in C++ via the sever_brawl_state decorator), combat awareness, the workshop-commission capability for smiths, group-meeting participant awareness, and survival needs. Each pairs with the matching action module. All five templates are listed below.\n\n# Member Prompts\n\n| Module | File | Lines | Purpose |\n|---|---|---|---|\n| Brawl | 0161_severactions_brawl.prompt | 15 | Fist-fight state context; ALL composition happens in the C++ sever_brawl_state decorator (SkyrimNetBridge.h) querying BrawlManager |\n| Combat | 0160_severactions_combat.prompt | 110 | Combat state context for NPC dialogue \u2014 lets NPCs respond appropriately during fights |\n| Crafting | submodules/system_head/0152_crafting_commission.prompt | 26 | Deferred workshop commissions; GATED to JobBlacksmithFaction so only smiths see it; capability intro always shown to smiths |\n| GroupMeeting | submodules/system_head/0260_severactions_engaged_participants.prompt | 84 | Gives an engaged party member the names of the rest of the active party so multi-companion conversations read naturally; SkyrimNet-native decorators only |\n| Survival | 0170_severactions_survival.prompt | 43 | Hunger, cold/warmth and fatigue status for followers and nearby NPCs |\n\n# Notes\n\n- The brawl prompt is the purest example of the thin-template pattern: the Jinja file is 15 lines because the native decorator does the composition \u2014 see [/systems/native-plugin.md](/systems/native-plugin.md).\n- The commission prompt pairs with CommissionItem/CollectCommission in [/actions/crafting.md](/actions/crafting.md); the survival prompt pairs with the survival script ([/scripts/companions.md](/scripts/companions.md)).\n\n# Citations\n\n[1] `sources/SeverActions/Prompts/Brawl/SKSE/Plugins/SkyrimNet/prompts/submodules/character_bio/0161_severactions_brawl.prompt`\n[2] `sources/SeverActions/Prompts/Combat/SKSE/Plugins/SkyrimNet/prompts/submodules/character_bio/0160_severactions_combat.prompt`\n[3] `sources/SeverActions/Prompts/Crafting/SKSE/Plugins/SkyrimNet/prompts/submodules/system_head/0152_crafting_commission.prompt`\n[4] `sources/SeverActions/Prompts/GroupMeeting/SKSE/Plugins/SkyrimNet/prompts/submodules/system_head/0260_severactions_engaged_participants.prompt`\n[5] `sources/SeverActions/Prompts/Survival/SKSE/Plugins/SkyrimNet/prompts/submodules/character_bio/0170_severactions_survival.prompt`"}, {"id": "references/project-overview", "type": "Reference", "title": "SeverActions \u2014 Project Overview", "description": "Purpose, feature matrix, requirements, installation, configuration and architecture of the SeverActions SkyrimNet action pack.", "tags": ["overview", "skyrimnet", "skyrim", "skse", "actions", "prompts"], "group": "references", "sz": 60, "body": "# Overview\n\n**SeverActions** (v3.9.13, by **Severause**) is an action, prompt and behaviour pack for **SkyrimNet**: NPCs act on what they say. They follow and travel across Skyrim, craft, cook and brew, manage outfits, handle gold and debt, sit down, fight, get arrested and escorted to jail, settle disputes with fists, run businesses for the player, and remember what happened. One principle runs through all of it: the AI decides what to do, and the mod makes it happen in-game \u2014 with the engine's own systems, not around them.\n\nEach module is a separate FOMOD option; install only what you want.\n\n# Actions by Module\n\n| Module | Actions | What it does |\n|---|---:|---|\n| Basic | 18 | Follow, pick up, give/take/bring items, loot containers and corpses, read books aloud, cast and teach spells and shouts, transfer ownership |\n| Enterprises | 26 | Hire NPCs to run mines, shops, farms, fences and guard posts; weekly settlements, wages, arrears, loans, hold stewards, taxes, hired-thug reprisals, outlaw-camp takeovers |\n| Arrest | 14 | Guards track bounties, dispatch across cells, escort prisoners who can plead mid-escort, investigate homes, pass judgment |\n| Economy | 10 | Gifts, payments, extortion, atomic item-for-gold trades, tabs, credit limits, due dates, recurring debt |\n| Follower | 9 | Companion framework with rapport, trust, loyalty and mood; homes, work and play locations, combat styles, follow distance |\n| Outfit | 8 | Equip/unequip by name, save and recall presets, situation outfits that switch automatically, persistent outfit locking |\n| Kidnap & Captives | 7 | Abduct or restrain a named NPC, with ransom, interrogation, escape and consequences (kidnap opt-in; restrain ships on) |\n| Crafting | 5 | Walk to a workstation, craft/cook/brew, deliver the result; commissions matured over in-game days |\n| Combat | 5 | Attack, cease fire, yield, and the outlaw-standoff verbs |\n| Brawl | 4 | Non-lethal fist fights \u2014 challenge, accept, decline, forfeit |\n| Travel | 3 | Navigate to named locations with a non-pausing confirmation popup, adjustable pace, off-screen simulation |\n| Furniture | 2 | Chairs, benches, beds and crafting stations, with automatic cleanup |\n| Adult (optional) | 2 | OSL Aroused / SexLab Aroused arousal adjustment |\n| Sever's Hearth (bundled) | 3 | Establish and break camp, and travel back to it |\n\nCount note: the shipped file inventory holds 125 action YAMLs under `Actions/` (including `cat_*` category files) plus 4 Hearth camp actions and 1 SkyrimNet trigger; the README's per-module figures predate later additions. See [/actions/index.md](/actions/index.md).\n\n# Context Prompts\n\nPrompts inject live game state into the AI's context, so NPCs *know* things rather than inventing them \u2014 74 templates across 16 installable modules, the largest being Enterprises (23), Core (15) and Follower (14). They cover: known spells \u00b7 carried gold \u00b7 inventory and worn gear \u00b7 nearby objects and containers \u00b7 the player's inventory \u00b7 combat and brawl state \u00b7 survival needs \u00b7 familiarity and reputation \u00b7 bounty and jail status \u00b7 merchant stock \u00b7 debts \u00b7 retainer and enterprise status \u00b7 commissions \u00b7 quest memory \u00b7 off-screen life \u00b7 camp and truce state \u00b7 relationships between companions. The shipped tree holds 77 `.prompt` files (74 module prompts + 2 core-level + 1 placed in the Outfit action tree). See [/prompts/index.md](/prompts/index.md).\n\n# Behaviour Systems\n\n- **Companions with continuity** \u2014 relationships drift, companions form opinions about *each other*, and dismissed followers live a life while you're away that they'll tell you about.\n- **Outlaw truces** \u2014 bandits and other outlaws hold their fire until provoked, so conversation is possible at all; camps can be talked into working for you, by their chief or by consensus.\n- **Off-screen travel** \u2014 NPCs sent somewhere actually get there, simulated across unloaded cells.\n- **A working crime system** \u2014 bounties, guards, jails, escorts, evidence and judgment.\n- **Survival needs** for followers, with hunger, cold and fatigue.\n\n# Requirements\n\n| Tier | Items |\n|---|---|\n| Required | Skyrim SE/AE, SKSE64, SkyrimNet, Address Library, PapyrusUtil |\n| Recommended | PrismaUI (in-game configuration UI), SkyUI (MCM) |\n| Optional | Nether's Follower Framework \u00b7 Devious Devices \u00b7 OSL/SexLab Aroused \u00b7 Fertility Mode \u00b7 Dynamic Book Framework \u00b7 UIExtensions |\n\nSeverActions **coexists** with Nether's Follower Framework rather than competing with it: when NFF owns a follower, recruit/dismiss/wait/resume are routed *through* NFF's own controller, and SeverActions never touches that follower's AI packages.\n\n# Installation\n\nInstall the archive with a mod manager and pick your modules in the FOMOD installer ([/configs/fomod-installer.md](/configs/fomod-installer.md)). Load order is not sensitive; place after SkyrimNet. Prompt modules are separate from action modules \u2014 a module's actions and prompts are usually worth installing together, but nothing breaks if you don't.\n\n# Configuration\n\nTwo surfaces, covering the same settings:\n\n- **PrismaUI** \u2014 the main in-game interface: dashboard, companions, inventory, world map and travel, outfits, survival, enterprises, and settings ([/systems/prismaui-interface.md](/systems/prismaui-interface.md)).\n- **MCM** (SkyUI) \u2014 the same settings for VR and non-PrismaUI setups: Interface, Hotkeys, Prompt Filters, Followers, Off-Screen Life, Outfits, Survival, Combat & Outlaws, Crime & Bounty, Economy, Enterprises, Travel, and Reading & Spells.\n\nGlobal preferences are stored **outside the save**, so a new character or a mod update keeps your settings.\n\n# Architecture\n\nFour layers, each doing what it is best at:\n\n1. **Action YAMLs** declare what the AI may do and when it is eligible ([/actions/index.md](/actions/index.md)).\n2. **Prompt templates** inject live state into the AI's context ([/prompts/index.md](/prompts/index.md)).\n3. **Papyrus** owns quest aliases, packages and anything the engine only exposes to scripts ([/scripts/index.md](/scripts/index.md)).\n4. **A native SKSE plugin** (~135k lines of C++) owns the data, the heavy scans, and everything performance- or thread-sensitive ([/systems/native-plugin.md](/systems/native-plugin.md)).\n\nState lives in the **SKSE co-save** (~40 records) rather than in Papyrus properties, behind a shared store base that gives every store the same save/load/revert contract and an opt-in migration path for schema changes \u2014 so updates land on existing saves without wiping anything.\n\n# Credits\n\n- **Author** \u2014 Severause; builds on [SkyrimNet](https://github.com/MinLL/SkyrimNet-GamePlugin) by MinLL.\n- Map artwork by Caro Tuts (Nexus #62705); hold sigils derived from CoMAP map markers by Parapets (Nexus #56123) and the Cities of the North pack, re-tinted to a parchment palette.\n- Imperial Fiscal Levy armour meshes/textures by NordwarUA (New Legion, Nexus #30468), recoloured to a Treasury livery \u2014 see [/assets/levy-armour-sets.md](/assets/levy-armour-sets.md).\n- The General's writ-blade by InsanitySorrow (Insanity's Ebony Sword Replacer, Nexus #37645); the Legates' blades by billyro (Mage Glass Sword, Nexus #38798) \u2014 see [/assets/levy-weapons.md](/assets/levy-weapons.md).\n\n# Citations\n\n[1] `sources/SeverActions/README.md`\n[2] `sources/SeverActions/fomod/info.xml`"}, {"id": "references/version-history", "type": "Reference", "title": "Version History", "description": "All 39 releases of SeverActions from v0.88 to v3.9.13 with their themes and headline changes.", "tags": ["changelog", "history", "releases"], "group": "references", "sz": 57, "body": "# Overview\n\nThe changelog lists **39 versions**, newest first, with narrative release notes. No calendar dates are given; the current version is **3.9.13** (also recorded in `fomod/info.xml` and `SeverActionsNative.toml`).\n\n# Release History\n\n| Version | Theme | Headline changes |\n|---|---|---|\n| v3.9.13 | Settling In | Followers excluded from travel action by default (+toggle); dressing saves auto-named outfit presets; home outfits switch in any player house; NFF-follower relax fix; familiarity blurb update button + fixes; wheel-menu key closes menu; VR travel crash fix (IsPathing); outfit auto-switch frame-spreading; situation-switch fixes; \"home\" = inside the house; Bio Blocks MCM page + 78-block starter library |\n| v3.9.11 | The quartermaster's ledger | Fix new-game/autosave crash from a wrong flag on the Levy's hidden deployment-room cell |\n| v3.9.10 | Housekeeping | Clear Home (Target) hotkey; ambient director keeps townsfolk trading locally; xEdit false positives on the Levy soldiers cleared |\n| v3.9.9 | Whose follower is this? | NFF-routed recruit/dismiss/wait/resume; camp registration fixes; LightFoot trap immunity; steward walk-arounds; template-shout teaching fix; beef-stew bow swap removed; brawl overhaul; Bio Blocks library page; live retainer locations; roster cap raised to 500 |\n| v3.9.2 | The camp asks your business | Pacified-camp door challenge; the verdict belongs to the outlaw (LetThemPass / RunThemOff); boss-chest plunder turns the camp; break propagation by roster; three new Outlaws settings |\n| v3.9.0 | Outlaws, industry, and the Voice | Outlaw truce layer default-on, runtime-only and fully recorded/reversible; camp swearing, mustering and morale; the Voice; biggest release since Enterprises |\n| v3.8.0 | Fullscreen UI, per-retainer schedules, alias overhaul | PrismaUI true fullscreen with auto-proportional density; per-retainer work hours incl. 24h bodyguard duty for any NPC; follow alias overhaul |\n| v3.7.3 | Custom-AI follower fix | Custom-AI followers no longer stuck on home/play packages mid-follow |\n| v3.7.2 | Pay off NPC bounties | PayNpcBountyToGuard from UI and dialogue; brawl spell-recovery safety net |\n| v3.7.1 | Custom bios, LLM trespass, travel overhaul | Per-companion custom bio blocks; LLM-driven trespass replacing scripted threat-stalking; travel wait-vs-errand parameter and phrasing resolution |\n| v3.5.0 | Abduction & restraint, morale with teeth | Kidnap/restraint systems, per-offender NPC bounties, ransom negotiation, interrogation, escape and consequences; stability pass |\n| v3.1.1 | Follower reliability, clearer arrangements | Recruiting working NPCs follows; Vassalage\u2192Indentured, Sworn\u2192Retained with valence colours; Dawnguard/Dragonborn masters dropped |\n| v3.1.0 | Enterprises | Retainers running off-screen ventures; Employed/Partnership/Tribute arrangements; arrears\u2192desertion; fences with heat and jail; courier letters; player-placed camp |\n| v3.0.7 | Mannequin fidelity | Skin subsurface/specular, SKEE overlays, makeup tint, warpaint; transparent-viewport fallback; outfit-menu crash fix; camp reliability |\n| v3.0.5 | Outfits, followers, arrest, survival fixes | Mannequin crash pass; ghost presets cleaned; stronger follower catch-up with track-only toggle; arrest-eligibility fix |\n| v3.0.1 | Skyrim VR support | Universal SE/AE/VR DLLs (CommonLibVR); VR startup deadlock and main-menu crash fixes; outfit EditorID fallback; survival warmth fallback |\n| v3.0 | Hearth Ledger, native cosave, arrest overhaul, brawl | Six-page UI rebuild; outfit subsystem rebuilt on a native cosave store; full arrest pipeline; fist-fight brawl system |\n| v2.9.9 | SkyrimNet Bio Audit Tier 1 | 55 priority character bios de-primed (speech_style priming, summary spoilers) |\n| v2.9.5 | Cross-cell follower teleport | Catch-up teleport across doors/cell boundaries; v2.1.7 aggression self-heal; outfit fixes (blacklist, rename, slot orphan cleanup, fuzzy matching) |\n| v2.9 | Outfit slot system | 50 followers \u00d7 8 preset bays (400 slot\u00d7preset triplets in the ESP); animated CastSpell; Daegon Kaekiri compat patch |\n| v2.7.0 | Cowering fix & prompt cleanup | Cowering mitigations; familiarity dedup; prompt-stack simplification; PrismaUI survival CSS; FOMOD target-selectors fix |\n| v2.5 | Cowering regression hunt | AIO patch rebuilt against the real ESP; follow template repairs; 2.1.7 confidence/aggression revert; ESP persistent-flag and orphan-record cleanup |\n| v2.2 | NPC knowledge rewrite | Single What-You-Know block combining familiarity tiers and role-based reputation |\n| v2.0.7 | Outfit exclusion & lock fixes | Per-follower outfit bypass toggle; re-equip loop guard; stale-lock and unbound-native fixes; survival template fix |\n| v2.0.6 | Manual-lock & sandbox fixes | DefaultOutfit suppression scoping; auto-sandbox deadlock fix; direct-address dialogue rule |\n| v2.0.5 | Outfit builder & follower QoL | Inventory-only builder mode; optimistic equip UI; follower soft reset; teleport behind player; global teleport cooldown |\n| v2.0 | Quest awareness | Firsthand/secondhand/unaware tiers; objective-driven LLM narratives; permanent SkyrimNet memories |\n| v1.95 | Banter & dialogue | Follower banter; anti-fixation and topic passthrough; PrismaUI pause; relationship blurb; injection-mode toggle |\n| v1.9 | Conditional knowledge | KnowledgeStore with cosave; World page revamp (bounties, debts, knowledge) |\n| v1.8 | Property & followers | Property ownership system; two-mode follower refactor; off-screen life; essential toggle; NFF-safe recruitment |\n| v1.6 | Inventory & actions | Inventory manager with transfer/equip/destroy; vanilla recruitment routing; actions page overhaul |\n| v1.1 | Custom AI | Custom AI detection; PrismaUI improvements |\n| v1.0 | Dashboard & homes | PrismaUI config dashboard; home system; inter-follower relationships |\n| v0.99 | Foundations | Loot transfer; self-healing follow; speaker selector; relationship assessment; group conversation rewrite |\n| v0.98 | Debt | Debt system; outfit lock; anti-duplicate actions |\n| v0.95 | Outfits & hotkeys | Outfit persistence; consolidated wait; hotkeys; wheel menu; EFF support |\n| v0.91 | Framework | Follower framework; outfit manager overhaul; yield monitor |\n| v0.90 | Reading & dispatch | Book reading; guard dispatch overhaul; NND integration |\n| v0.88 | Initial release | First public version |\n\n# Notes\n\n- Release arcs worth knowing: the outfit saga (v0.95 lock \u2192 v2.9 slots \u2192 v3.0 native cosave), the v3.0 arrest/brawl overhaul, Enterprises (v3.1.0), abduction (v3.5.0), and the v3.9.x outlaw-truce line.\n- Some versions contain detailed root-cause hunts (v2.5 cowering, v2.0.7 re-equip loop, v3.9.13 VR travel) \u2014 useful precedent for engine-interaction debugging.\n\n# Citations\n\n[1] `sources/SeverActions/CHANGELOG.md`"}, {"id": "scripts/companions", "type": "Script", "title": "Companion Scripts", "description": "Follow pool, follower lifecycle manager, survival needs and eating-animation Papyrus scripts.", "tags": ["scripts", "papyrus", "followers", "companions", "survival", "follow"], "group": "scripts", "sz": 36, "body": "# Overview\n\nFour scripts implement the companion framework's engine side: the follow alias pool, the follower lifecycle manager behind the companion actions, the survival needs system (hunger, cold, fatigue), and an optional eating-animation helper. Each ships as `.psc` plus compiled `.pex`. The LLM side of the same framework is documented in [/prompts/follower.md](/prompts/follower.md); the actions in [/actions/follower.md](/actions/follower.md).\n\n# Member Files\n\n| Script (.psc) | Compiled (.pex) | Role |\n|---|---|---|\n| SeverActions_Follow.psc | SeverActions_Follow.pex | Casual follow verbs and follow distance; rides the follow quest alias pool |\n| SeverActions_FollowerManager.psc | SeverActions_FollowerManager.pex | Companion lifecycle: register/wait/resume/dismiss/leave, homes, combat styles; executes most Follower-module actions |\n| SeverActions_Survival.psc | SeverActions_Survival.pex | Hunger, cold and fatigue tracking; settings adjustable via MCM |\n| SeverActions_EatingAnimations.psc | SeverActions_EatingAnimations.pex | Helper playing eating animations from TaberuAnimation.esp (Eating Animations and Sounds); optional, gracefully skips if absent |\n\n# Notable Behaviour\n\n- SeverActions_Follow implements the **200-alias follow pool (FLWD v18)**: one mechanism replaces the legacy 21-slot + PO3-override-overflow dual system \u2014 every follower rides an alias in SeverActions_FollowQuest whose CK packages (Close above V2) re-apply NATIVELY on cell load, closing the documented hole where PO3 overrides dropped on 3D unload.\n- FollowerManager syncs **healer combat-style configuration** (per-target/per-healer cooldowns, magicka gating, healChance) and **cell-catchup configuration** to the native HealerPoll and CellCatchup subsystems \u2014 see [/systems/native-plugin.md](/systems/native-plugin.md).\n- Survival warmth degrades gracefully on VR, falling back to armor-record warmth where the SE/AE engine API is unavailable (v3.0.1).\n- EatingAnimations checks keywords distributed at runtime by Keyword Item Distributor (KID); the mod is an optional dependency.\n- FollowerLeaves (companion quits for good) and the kidnap verbs execute here via FollowerManager \u2014 [/actions/kidnap.md](/actions/kidnap.md).\n\n# Citations\n\n[1] `sources/SeverActions/00 Core/Source/Scripts/SeverActions_{Follow,FollowerManager,Survival,EatingAnimations}.psc`\n[2] `sources/SeverActions/00 Core/Scripts/SeverActions_{Follow,FollowerManager,Survival,EatingAnimations}.pex`"}, {"id": "scripts/core-system", "type": "Script", "title": "Core & UI Scripts", "description": "Startup, settings, hotkeys, property gate and UI-bridge Papyrus scripts of SeverActions.", "tags": ["scripts", "papyrus", "init", "mcm", "hotkeys", "prismaui", "wheel-menu", "property"], "group": "scripts", "sz": 37, "body": "# Overview\n\nSix scripts own startup and the interface surface: initialization ordering, the shared property store with the ownership gate, MCM settings, configurable hotkeys, the PrismaUI bridge and the radial wheel menu. Each ships as source `.psc` under `00 Core/Source/Scripts/` and compiled `.pex` under `00 Core/Scripts/`. All 12 files are listed below.\n\n# Member Files\n\n| Script (.psc) | Compiled (.pex) | Role |\n|---|---|---|\n| SeverActions_Init.psc | SeverActions_Init.pex | Initialization: delays so all quest scripts run their OnInit first; heals the v2.1.7 aggression corruption |\n| SeverActions_Property.psc | SeverActions_Property.pex | Property ownership actions; the ownership gate lives here (issue #12) because eligibility decorators cannot see the dynamic propertyName parameter |\n| SeverActions_MCM.psc | SeverActions_MCM.pex | MCM settings mirroring properties in other scripts (currency, dialogue animation, etc.); passes settings to the native DLL |\n| SeverActions_Hotkeys.psc | SeverActions_Hotkeys.pex | MCM-configured hotkeys; includes the two-step use-furniture state (pick NPC, then furniture target) |\n| SeverActions_PrismaUI.psc | SeverActions_PrismaUI.pex | PrismaUI lifecycle bridge; passes quest references to C++ so the DataGatherer reads settings without going through Papyrus |\n| SeverActions_WheelMenu.psc | SeverActions_WheelMenu.pex | Radial wheel menu; option indices match wheel positions; hotkey configurable via MCM |\n\n# Notable Behaviour\n\n- The ownership gate in SeverActions_Property uses `Native_IsCellOwner`, accepting either a direct NPC owner or membership in the cell's faction owner (covering Hulda/Bannered Mare via BanneredMareInnFaction); an empty cleanName falls back to the actor's current cell.\n- The v2.1.7 aggression corruption heal in Init is the same self-heal documented for v2.9.5 \u2014 a defensive cleanup for old saves.\n- Hotkeys' furniture flow pairs with the Furniture actions ([/actions/furniture.md](/actions/furniture.md)); the wheel menu opens the action wheel whose entries map onto the action modules.\n\n# Dependencies\n\n- PrismaUI bridge talks to the compiled views in [/systems/prismaui-interface.md](/systems/prismaui-interface.md).\n- Settings recorded by MCM are read natively via the passed quest references \u2014 [/systems/native-plugin.md](/systems/native-plugin.md).\n- TransferOwnership eligibility: [/actions/basic.md](/actions/basic.md).\n\n# Citations\n\n[1] `sources/SeverActions/00 Core/Source/Scripts/SeverActions_{Init,Property,MCM,Hotkeys,PrismaUI,WheelMenu}.psc`\n[2] `sources/SeverActions/00 Core/Scripts/SeverActions_{Init,Property,MCM,Hotkeys,PrismaUI,WheelMenu}.pex`"}, {"id": "scripts/crime", "type": "Script", "title": "Crime & Combat Scripts", "description": "Bounty ledger, arrest dispatch, judgment, player confrontation, combat wiring, brawl and yield Papyrus scripts.", "tags": ["scripts", "papyrus", "arrest", "bounty", "crime", "combat", "brawl"], "group": "scripts", "sz": 40, "body": "# Overview\n\nSeven scripts implement the crime-and-combat engine side: the bounty ledger, the arrest/dispatch/escort machinery, the judgment phase, the player-bounty confrontation state machine, real-combat wiring, the brawl system and the yield alias. Each ships as `.psc` plus compiled `.pex`. Guard discovery itself is native (GuardFinder). Surfaces: [/actions/arrest.md](/actions/arrest.md), [/actions/combat.md](/actions/combat.md), [/actions/brawl.md](/actions/brawl.md); state prompts: [/prompts/arrest.md](/prompts/arrest.md).\n\n# Member Files\n\n| Script (.psc) | Compiled (.pex) | Role |\n|---|---|---|\n| SeverActions_Arrest.psc | SeverActions_Arrest.pex | Arrest, dispatch, escort and pleas; faction properties filled in CK; vanilla crime factions |\n| SeverActions_ArrestBounty.psc | SeverActions_ArrestBounty.pex | The bounty ledger; bounty-pay confirm popup bridge |\n| SeverActions_ArrestJudgment.psc | SeverActions_ArrestJudgment.pex | Judgment phase state and lifecycle (OrderJailed / OrderRelease) |\n| SeverActions_ArrestPlayer.psc | SeverActions_ArrestPlayer.pex | Player-bounty confrontation and persuasion FSM (ArrestPlayer, Accept/RejectPersuasion) |\n| SeverActions_Brawl.psc | SeverActions_Brawl.pex | Fist-fight system: challenge wait states, weapon/spell stripping, forfeit handling |\n| SeverActions_Combat.psc | SeverActions_Combat.pex | AttackTarget / CeaseFire / Yield execution; combat faction wiring |\n| SeverActions_YieldAlias.psc | SeverActions_YieldAlias.pex | Alias wiring for the yield flow |\n\n# Notable Behaviour\n\n- **Guard factions are owned by native GuardFinder** (`Native/src/GuardFinder.h`); the Papyrus side keeps references and lifecycle only.\n- **SeverActions_Combat** adds SeverActions_AttackFaction / SeverActions_TargetFaction to actors during AttackTarget so the AI Overhaul flee-suppression patch can suppress flee packages for NPCs in forced combat; they are removed when combat ends via RestoreOriginalValues. The vanilla follower faction is kept for reference only; the SkyrimNet follower faction is optional.\n- **SeverActions_Brawl** keeps transient state for the player-target popup loop and a PrismaUI-overlay defer-retry: when a challenge is triggered from a PrismaUI menu, that menu still holds focus for a beat after closing, so the overlay open is suppressed and retried a few times (PrismaUI_OpenBrawlPrompt) rather than dropping to the SkyMessage box.\n- **SeverActions_ArrestBounty** registers the bounty-pay confirm popup choice (PrismaUIBountyPromptBridge) on the load path \u2014 not OnInit \u2014 so existing saves also get the listener.\n- **SeverActions_ArrestPlayer** owns the confrontation + persuasion FSM that the 0276 prompt and Accept/RejectPersuasion actions drive.\n- The v2.1.7 confidence/aggression changes made here during PrepareForCombat were reverted in v2.5 and self-healed for old saves in v2.9.5 \u2014 see [/references/version-history.md](/references/version-history.md).\n\n# Citations\n\n[1] `sources/SeverActions/00 Core/Source/Scripts/SeverActions_{Arrest,ArrestBounty,ArrestJudgment,ArrestPlayer,Brawl,Combat,YieldAlias}.psc`\n[2] `sources/SeverActions/00 Core/Scripts/SeverActions_{Arrest,ArrestBounty,ArrestJudgment,ArrestPlayer,Brawl,Combat,YieldAlias}.pex`"}, {"id": "scripts/economy-crafting", "type": "Script", "title": "Economy & Crafting Scripts", "description": "Currency, debt ledger, crafting delivery and loot-transfer Papyrus scripts.", "tags": ["scripts", "papyrus", "currency", "debt", "crafting", "loot", "enterprises"], "group": "scripts", "sz": 36, "body": "# Overview\n\nFour scripts carry the coin, the ledgers and the physical handovers: Currency executes both the Economy trades and most Enterprises verbs (hiring, collections, wages, loans, taxes, camps), Debt owns the tab ledger, Crafting delivers work at stations, and Loot moves items between packs and tracks book reading. Each ships as `.psc` plus compiled `.pex`. Action surfaces: [/actions/economy.md](/actions/economy.md), [/actions/enterprises.md](/actions/enterprises.md), [/actions/crafting.md](/actions/crafting.md), [/actions/basic.md](/actions/basic.md).\n\n# Member Files\n\n| Script (.psc) | Compiled (.pex) | Role |\n|---|---|---|\n| SeverActions_Currency.psc | SeverActions_Currency.pex | Coin in hand: BuyItem, SellItem, GiveGold, CollectPayment, ExtortGold, RepayDebt \u2014 plus the Enterprises verbs (hire/dismiss, collections, wages, loans, taxes, camps) |\n| SeverActions_Debt.psc | SeverActions_Debt.pex | The debt ledger: CreateDebt, CreateRecurringDebt, AddToDebt, ReduceDebt, ForgiveDebt |\n| SeverActions_Crafting.psc | SeverActions_Crafting.pex | Walk-to-station crafting delivery: CraftItem, BrewPotion, CookMeal, CommissionItem, CollectCommission |\n| SeverActions_Loot.psc | SeverActions_Loot.pex | Item transfers and book reading: give/take/bring/pickup, loot/search, ReadBook/StopReading, UseItem |\n\n# Notable Behaviour\n\n- **Conjured Gold** (NPCs giving gold they do not have) ships OFF as of dev141 \u2014 a recorded user decision: with retainers, camps, stewards and the NPC labor economy all minting real coin, defaulting the money printer on no longer made sense. Existing saves keep whatever the player chose; the default only governs new games.\n- **SeverActions_Crafting** keeps no timing in Papyrus: CRAFT_TIME, INTERACTION_DISTANCE and arrival timeouts live as constants inside the native CraftingOrchestrator.h (kCraftTimeSeconds = 5) \u2014 see [/systems/native-plugin.md](/systems/native-plugin.md).\n- **SeverActions_Loot** stores active book-reading state (title + text) in per-actor StorageUtil, read by the prompts via papyrus_util \u2014 storing them as quest properties bloated the cosave on every save because book text can run tens of KB.\n- The debt system features credit limits, due dates, recurring charges, auto-growth from item gifts and automatic guard reporting for severely overdue debts (FOMOD description).\n\n# Citations\n\n[1] `sources/SeverActions/00 Core/Source/Scripts/SeverActions_{Currency,Debt,Crafting,Loot}.psc`\n[2] `sources/SeverActions/00 Core/Scripts/SeverActions_{Currency,Debt,Crafting,Loot}.pex`"}, {"id": "scripts/magic-travel", "type": "Script", "title": "Magic, Travel & Bridge Scripts", "description": "Spell casting and teaching, off-screen travel, furniture use and optional-framework bridge Papyrus scripts.", "tags": ["scripts", "papyrus", "spells", "shouts", "travel", "furniture", "arousal", "fertility"], "group": "scripts", "sz": 39, "body": "# Overview\n\nEight scripts cover the remaining engine surfaces: animated spellcasting and its alias dispatcher, spell/shout teaching, off-screen travel, furniture use, and three optional-framework bridges (OSL Aroused, SexLab Aroused, Fertility Mode Reloaded). Each ships as `.psc` plus compiled `.pex`. Related actions: [/actions/basic.md](/actions/basic.md) (cast/learn/teach), [/actions/travel.md](/actions/travel.md), [/actions/furniture.md](/actions/furniture.md), [/actions/adult.md](/actions/adult.md).\n\n# Member Files\n\n| Script (.psc) | Compiled (.pex) | Role |\n|---|---|---|\n| SeverActions_SpellCast.psc | SeverActions_SpellCast.pex | Animated NPC spellcasting (v2.9): charge and release with proper animation, heals-to-full auto-repeat for restoration |\n| SeverActions_SpellCastAlias.psc | SeverActions_SpellCastAlias.pex | ESP-filled properties and per-cast runtime state; the dispatcher calls in after ForceRefTo |\n| SeverActions_SpellTeach.psc | SeverActions_SpellTeach.pex | TeachSpell / LearnSpell / TeachShout; fade-to-black effect, failure system settings, visual FX |\n| SeverActions_Travel.psc | SeverActions_Travel.pex | TravelToPlace / ChangeTravelSpeed / CancelTravel and the hired-thug standoff verbs (ThugAttack, ThugStandDown from the Enterprises module) |\n| SeverActions_Furniture.psc | SeverActions_Furniture.pex | Furniture use; registers for the native cleanup event from FurnitureManager on game load |\n| SeverActions_Arousal.psc | SeverActions_Arousal.pex | OSL Aroused bridge; also provides the get_arousal_state decorator returning arousal JSON for prompts |\n| SeverActions_SLOArousal.psc | SeverActions_SLOArousal.pex | SexLab Aroused bridge; decorators global for template access |\n| SeverActions_FertilityMode_Bridge.psc | SeverActions_FertilityMode_Bridge.pex | Bridges Fertility Mode Reloaded data to SkyrimNet via native decorators |\n\n# Notable Behaviour\n\n- **Travel speed constants mirror the native TravelSpeed enum**; the stuck-detector skipped the SE-only IsPathing refinement on VR (v3.9.13 fix), falling back to distance-based checks.\n- **The SLO bridge adjusts the exposure component directly** via UpdateActorExposure \u2014 SetActorExposure(GetActorArousal + amount) would wrongly treat total arousal as the exposure value.\n- **The Fertility Mode bridge uses a hybrid native approach**: Papyrus reads FM's arrays and pushes them into a native cache for O(1) lookups; a real-time deadline after a None TrackedActors read prevents FM's benign per-read log line from repeating every 3 seconds while FM is idle. Quest scripts never receive OnPlayerLoadGame, so no such handler exists. Requires the FM Reloaded source files (_JSW_BB_Storage.psc, _JSW_BB_Utility.psc) to compile.\n- The Arousal decorator checks whether OSLAroused is loaded before reading values and derives a textual arousal description.\n\n# Citations\n\n[1] `sources/SeverActions/00 Core/Source/Scripts/SeverActions_{SpellCast,SpellCastAlias,SpellTeach,Travel,Furniture,Arousal,SLOArousal,FertilityMode_Bridge}.psc`\n[2] `sources/SeverActions/00 Core/Scripts/` matching `.pex` files"}, {"id": "scripts/outfit", "type": "Script", "title": "Outfit Scripts", "description": "Outfit actions, alias re-equip wiring and slot-system logging scripts.", "tags": ["scripts", "papyrus", "outfits", "presets", "slots"], "group": "scripts", "sz": 33, "body": "# Overview\n\nThree scripts back the Outfit module: the action executor (registered via YAML), the alias that re-applies outfits on load/cell/enable events, and the slot-system helper with dual-destination logging. Persistence itself lives in the native outfit store \u2014 the v3.0 rebuild on a native cosave \u2014 while these scripts handle equip/unequip timing and animation events. Actions surface: [/actions/outfit.md](/actions/outfit.md).\n\n# Member Files\n\n| Script (.psc) | Compiled (.pex) | Role |\n|---|---|---|\n| SeverActions_Outfit.psc | SeverActions_Outfit.pex | Outfit management actions \u2014 dress/undress/equip/unequip/presets/situations; compatible with Immersive Equipping Animations |\n| SeverActions_OutfitAlias.psc | SeverActions_OutfitAlias.pex | Events trigger re-equip on NPC load, cell change and enable; also holds the 60-second-cooldown bleedout recovery that restores half of base health |\n| SeverActions_OutfitSlot.psc | SeverActions_OutfitSlot.pex | Slot-system singleton; logging helper writes to BOTH Papyrus.0.log and SeverActionsNative.log so traces appear even with Papyrus logging disabled |\n\n# Notable Behaviour\n\n- Outfit-excluded actors are skipped entirely (the per-follower outfit bypass toggle from v2.0.7).\n- The alias restores a bleeding-out follower to half of base health once per cooldown \u2014 enough to stand up without trivializing combat.\n- The re-equip infinite-loop guard (per-actor re-entry protection from v2.0.7) lives on the alias/event path; manual locks correctly suppress DefaultOutfit (v2.0.6).\n- Preset persistence, rename and fuzzy matching are native (OutfitDataStore) \u2014 see [/systems/native-plugin.md](/systems/native-plugin.md).\n\n# Citations\n\n[1] `sources/SeverActions/00 Core/Source/Scripts/SeverActions_{Outfit,OutfitAlias,OutfitSlot}.psc`\n[2] `sources/SeverActions/00 Core/Scripts/SeverActions_{Outfit,OutfitAlias,OutfitSlot}.pex`"}, {"id": "systems/native-plugin", "type": "System", "title": "Native SKSE Plugin", "description": "The compiled native C++ layer (SeverActionsNative) owning data, heavy scans and everything performance- or thread-sensitive.", "tags": ["native", "skse", "cpp", "cosave", "decorators", "core"], "group": "systems", "sz": 44, "body": "# Overview\n\nThe native plugin is the fourth architecture layer: ~135k lines of C++ (per the README) owning the data, the heavy scans and everything performance- or thread-sensitive, while Papyrus owns quest aliases and packages. State lives in the **SKSE co-save (~40 records)** rather than Papyrus properties, behind a shared store base giving every store the same save/load/revert contract plus an opt-in migration path for schema changes \u2014 updates land on existing saves without wiping anything. Since v3.0.1 the DLLs are universal SE/AE/VR binaries compiled against CommonLibVR.\n\nThe C++ sources are not in this repository; the shipped artifacts are the compiled DLL, its registration TOML, and three Papyrus-facing stub scripts that expose native functions to the script side.\n\n# Member Files\n\n| File | Kind | Role |\n|---|---|---|\n| 00 Core/SKSE/Plugins/SeverActionsNative.dll | binary | The compiled native plugin |\n| 00 Core/SKSE/Plugins/SeverActionsNative.toml | config | SKSE plugin registration |\n| Source/Scripts/SeverActionsNative.psc (+ .pex) | Papyrus stub | Plugin info + string utilities replacing character-by-character Papyrus loops with native implementations |\n| Source/Scripts/SeverActionsNativeExt.psc (+ .pex) | Papyrus stub | Exposes HealerPoll and related subsystems |\n| Source/Scripts/SeverActionsNativeExt2.psc (+ .pex) | Papyrus stub | Exposes Enterprises labor/economy, hold taxes and camp-takeover functions |\n\n# Registration (SeverActionsNative.toml)\n\n| Key | Value |\n|---|---|\n| Name | SeverActionsNative |\n| Author | Severause |\n| Version | 3.9.13 |\n| MinimumSKSEVersion | 131 |\n| MinimumSkyrimVersion | 353 |\n| AddressLibrary | true |\n\n# Native Subsystems Referenced Across the Bundle\n\nNamed in headers, prompts and scripts throughout the source:\n\n| Subsystem | Used by |\n|---|---|\n| GuardFinder | arrest scripts own faction references; guard discovery is native |\n| CraftingOrchestrator (kCraftTimeSeconds = 5) | SeverActions_Crafting keeps no timing in Papyrus |\n| FurnitureManager | furniture cleanup event consumed by SeverActions_Furniture |\n| BrawlManager | queried by the sever_brawl_state decorator behind the brawl prompt |\n| TrespassMonitor | suppressed-trespass episodes rendered by the 0176 trespass prompt |\n| CellCatchup | follower catch-up configuration synced from FollowerManager |\n| HealerPoll | ~1s combat tick, priority chain player > self > ally, cooldowns + magicka + healChance, dispatches SeverActionsNative_HealerCast |\n| TravelSpeed enum | mirrored as constants in SeverActions_Travel |\n| OutfitDataStore | outfit presets, rename (case-insensitive), fuzzy name matching, lock enforcement |\n| EmploymentRegistry | seeded by labor_curation.json |\n| DataGatherer | reads settings via quest references passed by SeverActions_PrismaUI |\n| IntimacyStanceStore | written by the intimacy assessment prompt, read via sever_intimacy_stance |\n| Native_IsCellOwner | ownership gate in SeverActions_Property |\n\n# Decorators (native, called from Jinja prompts)\n\nsever_truce, sever_camp, sever_war_band, camp_challenge_pending, sever_brawl_state, custom_bio_blocks, retainer_status, enterprises_summary, npc_employer, npc_workforce, hold_tax_rate, is_tax_collector, is_guard_or_authority, debt_context, sever_intimacy_stance. All return \"\" for uninvolved actors so prompts cost nothing outside their situations.\n\n# Notes\n\n- SkyrimNet decorators must register AFTER SkyrimNet finishes standing up its own systems \u2014 registering earlier deadlocked VR startup (v3.0.1 fix).\n- A VR-incompatible fast-travel event sink is guarded; the fast-travel event does not exist on VR.\n- Kidnap, truce and captive state all persist through these co-save stores ([/actions/kidnap.md](/actions/kidnap.md), [/actions/combat.md](/actions/combat.md)).\n\n# Citations\n\n[1] `sources/SeverActions/00 Core/SKSE/Plugins/SeverActionsNative.dll` and `.toml`\n[2] `sources/SeverActions/00 Core/Source/Scripts/SeverActionsNative{,Ext,Ext2}.psc`\n[3] `sources/SeverActions/README.md` \u2014 Under the hood"}, {"id": "systems/prismaui-interface", "type": "System", "title": "PrismaUI Web Interface", "description": "Bundled PrismaUI web views \u2014 the config dashboard, diary, letter and non-pausing prompt overlays, plus the item-context SWF.", "tags": ["ui", "prismaui", "dashboard", "overlays", "web"], "group": "systems", "sz": 41, "body": "# Overview\n\nSeverActions ships its in-game interface as pre-built PrismaUI web views: a full configuration dashboard plus focused overlay views for confirmations, the follower diary, courier letters and arrest/brawl/retainer/travel prompts. The views are compiled Vite bundles (hashed asset filenames); a shared `client-Der9nqag.js` runtime ships 4 times (main, Diary, Letter, Prompt views). The Papyrus bridge is SeverActions_PrismaUI ([/scripts/core-system.md](/scripts/core-system.md)); the MCM is the fallback surface for VR and non-PrismaUI setups. 31 files are listed below.\n\n# Member Files\n\n## Main dashboard \u2014 PrismaUI/views/SeverActions/ (14 files)\n\n| File | Purpose |\n|---|---|\n| index.html | Entry page; title \"SeverActions Config\"; loads main-BBoYcSml.js, preloads client-Der9nqag.js and main-DwXf0qPX.css |\n| skyrim-map.png | Parchment Skyrim atlas base (Caro Tuts paper map) for the World page |\n| assets/client-Der9nqag.js | Shared Vite client runtime |\n| assets/main-BBoYcSml.js | Main application bundle |\n| assets/main-DwXf0qPX.css | Main stylesheet |\n| sigils/dawnstar.png | Hold sigil marker |\n| sigils/falkreath.png | Hold sigil marker |\n| sigils/markarth.png | Hold sigil marker |\n| sigils/morthal.png | Hold sigil marker |\n| sigils/riften.png | Hold sigil marker |\n| sigils/solitude.png | Hold sigil marker |\n| sigils/whiterun.png | Hold sigil marker |\n| sigils/windhelm.png | Hold sigil marker |\n| sigils/winterhold.png | Hold sigil marker |\n\n## Diary view \u2014 SeverActionsDiary/ (4 files)\n\n| File | Purpose |\n|---|---|\n| index.html | Follower diary reader |\n| assets/client-Der9nqag.js | Shared client runtime |\n| assets/diary-C5m9arau.js | Diary view bundle |\n| assets/diary-C6-cjn6R.css | Diary stylesheet |\n\n## Letter view \u2014 SeverActionsLetter/ (4 files)\n\n| File | Purpose |\n|---|---|\n| index.html | Letter reader (courier letters feature) |\n| assets/client-Der9nqag.js | Shared client runtime |\n| assets/letter-7CqVZlV0.js | Letter view bundle |\n| assets/letter-DtHbtKH6.css | Letter stylesheet |\n\n## Prompt view \u2014 SeverActionsPrompt/ (4 files)\n\n| File | Purpose |\n|---|---|\n| index.html | Generic confirmation prompt overlay |\n| assets/client-Der9nqag.js | Shared client runtime |\n| assets/prompt-DzO-U9tV.js | Prompt view bundle |\n| assets/prompt-BofJ1Axu.css | Prompt stylesheet |\n\n## Single-file overlay views (4 files)\n\n| File | Purpose |\n|---|---|\n| SeverActionsArrestPrompt/index.html | Non-pausing arrest/bounty confirmation popup |\n| SeverActionsBrawlPrompt/index.html | Non-pausing brawl challenge popup |\n| SeverActionsRetainerPrompt/index.html | Retainer hearing/arrangement popup |\n| SeverActionsTravelPrompt/index.html | Non-pausing travel confirmation popup |\n\n## Item context \u2014 Interface/ (1 file)\n\n| File | Purpose |\n|---|---|\n| severitemcontext.swf | Scaleform item-context menu |\n\n# Pages (per README and changelog)\n\nDashboard (Portal Tiles frontispiece), Companions, Inventory, World (parchment map with hold sigil markers, per-hold drawer: bounty, properties, travel, debts), Outfits (roster + mannequin preview), Survival (Camp shell, Party Vitals, Rations/Warmth/Risk), Enterprises, Stats/Spells, Settings. The v3.0 \"Hearth Ledger\" visual identity (parchment + brass + dark surface) and the v3.8.0 true-fullscreen with auto-proportional density apply to these views.\n\n# Citations\n\n[1] `sources/SeverActions/00 Core/PrismaUI/views/**`\n[2] `sources/SeverActions/00 Core/Interface/severitemcontext.swf`"}, {"id": "systems/severs-hearth", "type": "System", "title": "Sever's Hearth (bundled)", "description": "Bundled camping mini-mod with its own ESP, native plugin, script, camp actions and camp prompt.", "tags": ["hearth", "camping", "bundled", "native", "skse"], "group": "systems", "sz": 35, "body": "# Overview\n\n**Sever's Hearth** is a self-contained camping mini-mod bundled with SeverActions (README module table: 3 actions \u2014 establish camp, break camp, travel back to it). It ships its own ESP, its own native SKSE plugin (universal SE/AE/VR like the main one), one quest script, a seq file, four SkyrimNet action YAMLs and one camp-context prompt. All 11 files are listed below.\n\n# Member Files\n\n| File | Purpose |\n|---|---|\n| 00 Core/SeversHearth.esp | The mini-mod plugin (47,432 bytes) |\n| 00 Core/SKSE/Plugins/SeversHearthNative.dll | Compiled native plugin |\n| 00 Core/SKSE/Plugins/SeversHearthNative.toml | Plugin registration |\n| 00 Core/Source/Scripts/SeversHearth_Camp.psc | Camp quest script source |\n| 00 Core/Scripts/SeversHearth_Camp.pex | Compiled camp script |\n| 00 Core/seq/SeversHearth.seq | Scene/sequencer file |\n| Actions/Camp/SKSE/Plugins/SkyrimNet/config/actions/EstablishCamp.yaml | Pitch a new camp \u2014 fire ring, bedroll, gear from the Camp Kit |\n| Actions/Camp/SKSE/Plugins/SkyrimNet/config/actions/BreakCamp.yaml | Snuff the fire, pack tent and bedroll, stow gear |\n| Actions/Camp/SKSE/Plugins/SkyrimNet/config/actions/GoT
