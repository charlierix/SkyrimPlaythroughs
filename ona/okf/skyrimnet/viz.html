ndit_plunderer_generic.prompt` | 36 | A ruthless bandit plunderer who lives by theft and violence, motivated by greed and survival. Hostile to outsiders, quick to threaten, and prone to boasting about criminal exploits while dreaming of a better life beyond banditry. |\n| `bandit_thug_generic.prompt` | 39 | A ruthless, opportunistic outlaw who lives by plunder and violence. Bandit Thug is hardened by a life outside the law, motivated by greed, and quick to attack travelers for their valuables. Cynical and brutal, they maintain a rough camaraderie with fellow band |\n| `hired_thug_generic.prompt` | 33 | A ruthless Nord mercenary hired to punish thieves through violence. Operates with two other thugs to \"teach lessons\" to those who steal, though his true intent is lethal. Professional in approach but brutal in execution, he tracks targets methodically and atta |\n| `marauder_generic.prompt` | 34 | A ruthless Orcish bandit operating from Bleak Falls Tower with his crew, known for his aggressive fighting style and territorial control of the road between Riverwood and Bleak Falls Barrow. |\n| `mistwatch_bandit_generic.prompt` | 35 | A ruthless outlaw stationed at Mistwatch Fort who survives through theft and violence. Opportunistic and territorial, they attack travelers for valuables while dreaming of a better life beyond banditry. |\n| `reaver_highwayman_generic.prompt` | 37 | A hardened Dunmer bandit operating on Solstheim who survives through theft, intimidation, and violence. Bitter about life circumstances, dreams of escape from Solstheim while maintaining a ruthless approach to survival. |\n| `reaver_marauder_generic.prompt` | 37 | A hardened Dunmer bandit operating on Solstheim who survives through raiding, theft, and violence. Cynical and opportunistic, they harbor dreams of escaping their harsh life while displaying ruthless pragmatism toward outsiders. |\n| `reaver_outlaw_generic.prompt` | 37 | A hardened Dunmer bandit operating on Solstheim who survives through theft, violence, and intimidation. Bitter about life circumstances, opportunistic, and quick to violence, with fleeting dreams of escaping their dangerous lifestyle. |\n| `reaver_plunderer_generic.prompt` | 37 | A hardened Dunmer bandit operating on Solstheim who survives through theft, violence, and intimidation. Cynical and opportunistic, they harbor dreams of escaping their harsh life while displaying ruthless pragmatism toward outsiders. |\n| `reaver_thug_generic.prompt` | 38 | A ruthless Dunmer bandit operating on Solstheim who survives through theft, violence, and intimidation. Bitter about life circumstances, prone to aggression, and harbors dreams of escaping their current situation. |\n\n# Related\n\n- Every bio here renders through the shared [character bio submodule](/prompts/components/character-bio.md).\n- Generic templates backfill NPCs that lack a named bio; the named population is organized under `characters/factions/`, `characters/locations/` and `characters/named/`.\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/plugins/skyrimnet/base/prompts/characters`"}, {"id": "characters/generic/court-nobility", "type": "Generic Character Template", "title": "Generic Templates \u2014 Court & Nobility", "description": "Reusable generic bios covering 2 court & nobility archetypes.", "tags": ["skyrimnet", "npcs", "bios", "generic-template"], "group": "characters", "sz": 31, "body": "# Overview\n\nReusable `_generic.prompt` archetype bios covering 2 court & nobility archetypes. Generic bios typically define several behavioral archetypes to pick from per scene plus shared behavioral constants (e.g. yielding thresholds), and are used for NPCs without a named bio.\n\n# Member bios\n\nAll 2 member items assigned to this concept (verified against the manifest):\n\n| Bio file | Lines | Summary (first-person bio opening) |\n|---|---|---|\n| `noble_generic.prompt` | 35 | A haughty Imperial nobleman who travels Skyrim's roads with an Imperial Legion bodyguard, tre acy with her sister Bolar to eliminate his wives |\n| `yrsarald_thrice-pierced_E08.prompt` | 35 | Yrsarald Thrice-Pierced is a battle-hardened Nord officer and key military strategist in the Stormcloak rebellion. As one of Ulfric's trusted lieutenants, he helps coordinate rebellion operations from the Palace of the Kings in Windhelm, working closely with G |\n\n# Related\n\n- Every bio here renders through the shared [character bio submodule](/prompts/components/character-bio.md).\n\n# Citations\n\n[1] `sources/SkyrimNet-"}, {"id": "ci-and-templates", "type": "Repository Config", "title": "CI Workflows & Issue Templates", "description": "GitHub Actions workflows (validate, publish-base-index, cleanup-prereleases) and issue-template forms.", "tags": ["skyrimnet", "project"], "group": "(root)", "sz": 30, "body": "# Overview\n\nContinuous-integration assets: the `Validate Assets` workflow runs on `windows-latest`, downloading Spriggit CLI 0.40.0 (to verify/rebuild the ESP from the spriggit tree) and the Papyrus compiler 2025.03.18 (to compile `Source/Scripts` against `headers/`).\n\n# Member files\n\nAll 5 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `.github/ISSUE_TEMPLATE/bug_report.yml` | 5.5KB | 175 | name: Bug Report |\n| `.github/ISSUE_TEMPLATE/feature_request.yml` | 2.8KB | 81 | name: Feature Request |\n| `.github/workflows/cleanup-prereleases.yml` | 791.0B | 27 | name: Cleanup test prereleases |\n| `.github/workflows/publish-base-index.yml` | 3.6KB | 94 | name: Publish base-index |\n| `.github/workflows/validate.yml` | 4.2KB | 118 | name: Validate Assets |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/.github/ISSUE_TEMPLATE/bug_report.yml`\n[2] `sources/SkyrimNet-GamePlugin/.github/ISSUE_TEMPLATE/feature_request.yml`\n[3] `sources/SkyrimNet-GamePlugin/.github/workflows/cleanup-prereleases.yml`\n[4] `sources/SkyrimNet-GamePlugin/.github/workflows/publish-base-index.yml`\n[5] `sources/SkyrimNet-GamePlugin/.github/workflows/validate.yml`"}, {"id": "docs/migration-beta25", "type": "Documentation", "title": "Beta 25 Migration Guide", "description": "Migration notes to the beta25 layout plus the Claude agent command that performs the migration.", "tags": ["skyrimnet", "documentation", "modding"], "group": "docs", "sz": 28, "body": "# Overview\n\nMigration guide for the beta25 plugin-hub layout: new folder layout on the player's machine, trigger/action filename rules, knowledge-pack handling, manifest requirements and what is not allowed inside a plugin. A Claude agent command automates the file moves.\n\n# Member files\n\nAll 2 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `.claude/commands/migrate-beta25.md` | 4.7KB | 103 |  |\n| `docs/modding/MIGRATING_TO_BETA25.md` | 12.5KB | 267 | Migrating SkyrimNet Content to Beta 25 |\n\n# Related\n\n- Migration background lives in the historical [bio partition tool](/tools/bios-partition.md).\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/.claude/commands/migrate-beta25.md`\n[2] `sources/SkyrimNet-GamePlugin/docs/modding/MIGRATING_TO_BETA25.md`"}, {"id": "docs/modding-workflows", "type": "Documentation", "title": "Modding Workflow Guides", "description": "Modder guides for triggers, prompts, actions and mod integration (WORKFLOW_*.md).", "tags": ["skyrimnet", "documentation", "modding"], "group": "docs", "sz": 30, "body": "# Overview\n\nPhase-based workflow guides for modders: creating actions (discovery \u2192 Papyrus function exploration via MCP \u2192 authoring), creating prompts (decorator discovery, the core `decnpc()` decorator, template syntax), creating triggers (live event exploration \u2192 response design), and integrating mods end-to-end (source code vs MCP as source of truth).\n\n# Member files\n\nAll 4 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `docs/modding/WORKFLOW_ACTIONS.md` | 15.0KB | 550 | SkyrimNet Action Creation Workflow |\n| `docs/modding/WORKFLOW_MOD_INTEGRATION.md` | 13.7KB | 481 | SkyrimNet Mod Integration Workflow |\n| `docs/modding/WORKFLOW_PROMPTS.md` | 22.7KB | 804 | SkyrimNet Prompt Creation Workflow |\n| `docs/modding/WORKFLOW_TRIGGERS.md` | 11.9KB | 375 | SkyrimNet Trigger Creation Workflow |\n\n# Related\n\n- Workflow guides build on [prompt file syntax](/docs/prompt-syntax.md).\n- Mod integration calls the [public Papyrus API](/scripts/api.md).\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/docs/modding/WORKFLOW_ACTIONS.md`\n[2] `sources/SkyrimNet-GamePlugin/docs/modding/WORKFLOW_MOD_INTEGRATION.md`\n[3] `sources/SkyrimNet-GamePlugin/docs/modding/WORKFLOW_PROMPTS.md`\n[4] `sources/SkyrimNet-GamePlugin/docs/modding/WORKFLOW_TRIGGERS.md`"}, {"id": "docs/model-agents", "type": "Documentation", "title": "Model Agents & Usage", "description": "Maps SkyrimNet LLM roles (NPC roleplay, memory generation/retrieval, meta evaluation) to models and parameters.", "tags": ["skyrimnet", "documentation", "modding"], "group": "docs", "sz": 27, "body": "# Overview\n\nSkyrimNet leverages different models for different functions \u2014 NPC roleplaying, memory generation and retrieval, and meta evaluation \u2014 all working together to bring Skyrim to life in seamless fashion. Models and their parameters can be viewed and changed under Advanced Configuration \u2192 OpenRouter in the web UI.\n\n# Member files\n\nAll 1 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `docs/Agents.md` | 2.4KB | 42 | Model Agents and Usage |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/docs/Agents.md`"}, {"id": "docs/prompt-syntax", "type": "Documentation", "title": "Prompt File Syntax & Decorators", "description": "Reference for .prompt file syntax and decorators used across prompt bundles.", "tags": ["skyrimnet", "documentation", "modding"], "group": "docs", "sz": 29, "body": "# Overview\n\nReference for the Inja template syntax used by `.prompt` files \u2014 expressions `{{ ... }}`, comments `{# ... #}`, control-flow statements (loops, conditionals, assignments), includes, functions, template inheritance and whitespace control \u2014 plus the prompts-and-decorators overview of system head, character bios and custom decorators.\n\n# Member files\n\nAll 2 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `docs/modding/prompt-file-syntax.md` | 3.0KB | 159 | \ud83e\uddfe Prompt Syntax Reference (Inja Template Syntax) |\n| `docs/modding/prompts-and-decorators.md` | 2.6KB | 66 | Prompts in Skyrimnet |\n\n# Related\n\n- Decorator behavior is exercised by the [decorator test suite](/prompts/components/test-decorators.md).\n- The plugin also serves an in-game [decorators reference](/runtime/decorators-doc.md).\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/docs/modding/prompt-file-syntax.md`\n[2] `sources/SkyrimNet-GamePlugin/docs/modding/prompts-and-decorators.md`"}, {"id": "esp/audio", "type": "ESP Record \u2014 Audio", "title": "ESP Audio Records", "description": "Bard-singing/virtual-speakers/voice sound categories, the 2DD dialogue sound output model and the SilentVoice type.", "tags": ["skyrimnet", "esp", "records"], "group": "esp", "sz": 31, "body": "# Overview\n\nAudio records: sound categories for bard singing, virtual speakers and voice; the 2D-dry dialogue sound output model; and the `SilentVoice` voice type.\n\n# Member records\n\nAll 5 member items assigned to this concept (verified against the manifest):\n\n| Record file | FormKey | EditorID |\n|---|---|---|\n| `SkyrimNet_AudioCategoryBardSinging - 0012E3_SkyrimNet.esp.json` | `0012E3:SkyrimNet.esp` | SkyrimNet_AudioCategoryBardSinging |\n| `SkyrimNet_AudioCategoryVirtualSpeakers - 0012E5_SkyrimNet.esp.json` | `0012E5:SkyrimNet.esp` | SkyrimNet_AudioCategoryVirtualSpeakers |\n| `SkyrimNet_AudioCategoryVoice - 0012E4_SkyrimNet.esp.json` | `0012E4:SkyrimNet.esp` | SkyrimNet_AudioCategoryVoice |\n| `SkyrimNet_SOMDialogue2DDry - 0012E6_SkyrimNet.esp.json` | `0012E6:SkyrimNet.esp` | SkyrimNet_SOMDialogue2DDry |\n| `SilentVoice - 000E9A_SkyrimNet.esp.json` | `000E9A:SkyrimNet.esp` | SilentVoice |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/spriggit/SkyrimNet/SoundCategories/SkyrimNet_AudioCategoryBardSinging - 0012E3_SkyrimNet.esp.json`\n[2] `sources/SkyrimNet-GamePlugin/spriggit/SkyrimNet/SoundCategories/SkyrimNet_AudioCategoryVirtualSpeakers - 0012E5_SkyrimNet.esp.json`\n[3] `sources/SkyrimNet-GamePlugin/spriggit/SkyrimNet/SoundCategories/SkyrimNet_AudioCategoryVoice - 0012E4_SkyrimNet.esp.json`\n[4] `sources/SkyrimNet-GamePlugin/spriggit/SkyrimNet/SoundOutputModels/SkyrimNet_SOMDialogue2DDry - 0012E6_SkyrimNet.esp.json`\n[5] `sources/SkyrimNet-GamePlugin/spriggit/SkyrimNet/VoiceTypes/SilentVoice - 000E9A_SkyrimNet.esp.json`"}, {"id": "esp/factions", "type": "ESP Record \u2014 Faction", "title": "ESP Factions", "description": "Actor whitelist, actor blacklist and following-player faction records.", "tags": ["skyrimnet", "esp", "records"], "group": "esp", "sz": 28, "body": "# Overview\n\nThree faction records: actor whitelist, actor blacklist and following-player.\n\n# Member records\n\nAll 3 member items assigned to this concept (verified against the manifest):\n\n| Record file | FormKey | EditorID |\n|---|---|---|\n| `SkyrimNet_ActorBlacklistFaction - 0012DB_SkyrimNet.esp.json` | `0012DB:SkyrimNet.esp` | SkyrimNet_ActorBlacklistFaction |\n| `SkyrimNet_ActorWhitelistFaction - 0012DA_SkyrimNet.esp.json` | `0012DA:SkyrimNet.esp` | SkyrimNet_ActorWhitelistFaction |\n| `SkyrimNet_FollowingPlayerFaction - 000E8B_SkyrimNet.esp.json` | `000E8B:SkyrimNet.esp` | SkyrimNet_FollowingPlayerFaction |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/spr yrimNet.esp.json`\n[2] `sources/SkyrimNet-GamePlugin/spriggit/SkyrimNet/Perks/SkyrimNet_TelepathyPerk - 0012DD_SkyrimNet.esp.json`"}, {"id": "esp/quests", "type": "ESP Record \u2014 Quest", "title": "ESP Quests", "description": "skynet_MainController controller quest and skynet_Mcm MCM quest.", "tags": ["skyrimnet", "esp", "records"], "group": "esp", "sz": 27, "body": "# Overview\n\n`skynet_MainController` (000802) \u2014 the controller quest whose VM adapter carries the runtime scripts (e.g. `skynet_Library` with faction properties) \u2014 and `skynet_Mcm` (000D63), the MCM host quest.\n\n# Member records\n\nAll 2 member items assigned to this concept (verified against the manifest):\n\n| Record file | FormKey | EditorID |\n|---|---|---|\n| `skynet_MainController - 000802_SkyrimNet.esp.json` | `000802:SkyrimNet.esp` | skynet_MainController |\n| `skynet_Mcm - 000D63_SkyrimNet.esp.json` | `000D63:SkyrimNet.esp` | skynet_Mcm |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/spriggit/SkyrimNet/Quests/skynet_MainController - 000802_SkyrimNet.esp.json`\n[2] `sources/SkyrimNet-GamePlugin/spriggit/SkyrimNet/Quests/skynet_Mcm - 000D63_SkyrimNet.esp.json`"}, {"id": "esp/spells", "type": "ESP Record \u2014 Spell", "title": "ESP Spells", "description": "Seven spell records for voice input modes, wheel menu and telepathy listening.", "tags": ["skyrimnet", "esp", "records"], "group": "esp", "sz": 30, "body": "# Overview\n\nSeven spell records granting the voice-input powers (Direct, Normal, Thought, Transform), the wheel-menu power and telepathy listening.\n\n# Member records\n\nAll 7 member items assigned to this concept (verified against the manifest):\n\n| Record file | FormKey | EditorID |\n|---|---|---|\n| `skynet_TelepathyEavesdropDebugPower - 0012E0_SkyrimNet.esp.json` | `0012E0:SkyrimNet.esp` | skynet_TelepathyEavesdropDebugPower |\n| `skynet_TelepathyListenInSpell - 0012E2_SkyrimNet.esp.json` | `0012E2:SkyrimNet.esp` | skynet_TelepathyListenInSpell |\n| `skynet_VoiceInputDirectSpell - 0012D3_SkyrimNet.esp.json` | `0012D3:SkyrimNet.esp` | skynet_VoiceInputDirectSpell |\n| `skynet_VoiceInputNormalSpell - 0012D4_SkyrimNet.esp.json` | `0012D4:SkyrimNet.esp` | skynet_VoiceInputNormalSpell |\n| `skynet_VoiceInputThoughtSpell - 0012D6_SkyrimNet.esp.json` | `0012D6:SkyrimNet.esp` | skynet_VoiceInputThoughtSpell |\n| `skynet_VoiceInputTransformSpell - 0012D8_SkyrimNet.esp.json` | `0012D8:SkyrimNet.esp` | skynet_VoiceInputTransformSpell |\n| `skynet_WheelMenuSpell - 000D65_SkyrimNet.esp.json` | `000D65:SkyrimNet.esp` | skynet_WheelMenuSpell |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/spriggit/SkyrimNet/Spells`"}, {"id": "esp/spriggit-metadata", "type": "Tooling Metadata", "title": "Spriggit Metadata", "description": "spriggit-meta.json, root RecordData.json and GroupRecordData.json files describing the Spriggit serialization of SkyrimNet.esp.", "tags": ["skyrimnet", "esp", "records"], "group": "esp", "sz": 30, "body": "# Overview\n\nSpriggit serialization metadata for `SkyrimNet.esp`: package meta (`Spriggit.Json.Skyrim` 0.40.1, SkyrimSE), the root `RecordData.json`, and per-group `GroupRecordData.json` index files. Rebuild the ESP with `Spriggit.CLI.exe convert-to-plugin -i spriggit/SkyrimNet -o SkyrimNet.esp`.\n\n# Build usage\n\n```\n# Rebuild the ESP from this tree (Spriggit CLI 0.40.x)\nSpriggit.CLI.exe convert-to-plugin -i spriggit/SkyrimNet -o SkyrimNet.esp\n\n# Compile the Papyrus scripts (see scripts/core-runtime)\npapyrus.exe -nocache -h headers -i Source/Scripts -output Scripts\n```\n\n# Member files\n\nAll 5 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `spriggit/SkyrimNet/Cells/9/3/GroupRecordData.json` | 90.0B | 5 | { |\n| `spriggit/SkyrimNet/Cells/9/GroupRecordData.json` | 87.0B | 5 | { |\n| `spriggit/SkyrimNet/Cells/GroupRecordData.json` | 29.0B | 3 | { |\n| `spriggit/SkyrimNet/RecordData.json` | 335.0B | 18 | { |\n| `spriggit/SkyrimNet/spriggit-meta.json` | 125.0B | 6 | { |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/spriggit/SkyrimNet/spriggit-meta.json`\n[2] `sources/SkyrimNet-GamePlugin/RecordData.json`\n[3] `sources/SkyrimNet-GamePlugin/Cells/**/GroupRecordData.json`"}, {"id": "esp/world-data", "type": "ESP Record \u2014 Cell & Global", "title": "ESP Cell & Globals", "description": "SkyrimNetTestCell record and prayAnimationGlobal global.", "tags": ["skyrimnet", "esp", "records"], "group": "esp", "sz": 27, "body": "# Overview\n\nThe `SkyrimNetTestCell` cell (0012E7, serialized under `Cells/9/3/`) and the `prayAnimationGlobal` global (000E99).\n\n# Member records\n\nAll 2 member items assigned to this concept (verified against the manifest):\n\n| Record file | FormKey | EditorID |\n|---|---|---|\n| `RecordData.json` | `0012E7:SkyrimNet.esp` | SkyrimNetTestCell |\n| `prayAnimationGlobal - 000E99_SkyrimNet.esp.json` | `000E99:SkyrimNet.esp` | prayAnimationGlobal |\n\n# Related\n\n- Records are serialized by [Spriggit metadata](/esp/spriggit-metadata.md).\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/spriggit/SkyrimNet/Cells/9/3/SkyrimNetTestCell - 0012E7_SkyrimNet.esp/RecordData.json`\n[2] `sources/SkyrimNet-GamePlugin/spriggit/SkyrimNet/Globals/prayAnimationGlobal - 000E99_SkyrimNet.esp.json`"}, {"id": "model-presets", "type": "Configuration", "title": "Model Presets", "description": "OpenRouter preset YAMLs (budget/balanced/premium), recommended-models list and the dashboard manifest that enumerates them.", "tags": ["skyrimnet", "project", "llm"], "group": "(root)", "sz": 35, "body": "# Overview\n\nThe dashboard fetches `model-presets/index.yaml` once (cached ~10 minutes) to enumerate the built-in presets and the recommended-models file; dropping a new YAML into `presets/` and registering it in the index requires no code change. Shipped presets configure OpenRouter budget/balanced/premium model rotations.\n\n# Built-in presets\n\n| Preset id | Name | Provider | File |\n|---|---|---|---|\n| `openrouter-budget` | Budget | openrouter | `presets/openrouter-budget.yaml` |\n| `openrouter-default` | Balanced | openrouter | `presets/openrouter-default.yaml` |\n| `openrouter-performance` | Premium | openrouter | `presets/openrouter-performance.yaml` |\n\n`recommended-models.yaml` drives the dashboard ModelPicker's Recommended section; each entry carries an `id` (provider model id) plus optional sampling fields: `temperature`, `max_tokens`, `top_p`, `top_k`, `frequency_penalty`, `presence_penalty`. A bare-string form applies no overrides.\n\n# Member files\n\nAll 5 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `model-presets/index.yaml` | 682.0B | 21 | SkyrimNet model-presets manifest. The dashboard fetches this once |\n| `model-presets/presets/openrouter-budget.yaml` | 2.8KB | 74 | Budget preset \u2014 Gemma-3 27B for the cheap bulk variants, Qwen 235B |\n| `model-presets/presets/openrouter-default.yaml` | 2.8KB | 74 | Default preset \u2014 mirrors the in-code TextModelConfig defaults. |\n| `model-presets/presets/openrouter-performance.yaml` | 3.0KB | 77 | Performance preset \u2014 Sonnet 4.6 for dialogue/profiles/diary/action/ |\n| `model-presets/recommended-models.yaml` | 4.3KB | 172 | Recommended models surfaced in the dashboard's ModelPicker |\n\n# Related\n\n- Presets configure the model roles described in [Model Agents & Usage](/docs/model-agents.md).\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/model-presets/index.yaml`\n[2] `sources/SkyrimNet-GamePlugin/model-presets/presets/openrouter-budget.yaml`\n[3] `sources/SkyrimNet-GamePlugin/model-presets/presets/openrouter-default.yaml`\n[4] `sources/SkyrimNet-GamePlugin/model-presets/presets/openrouter-performance.yaml`\n[5] `sources/SkyrimNet-GamePlugin/model-presets/recommended-models.yaml`"}, {"id": "overview", "type": "Overview", "title": "SkyrimNet Project Overview", "description": "Single SKSE plugin that turns Skyrim NPCs into LLM-driven conversationalists with memory, opinions and autonomous behavior (README).", "tags": ["skyrimnet", "project"], "group": "(root)", "sz": 42, "body": "# Overview\n\nSkyrimNet turns every Skyrim NPC into a real conversationalist: NPCs hold their own opinions, remember what happened to them, react to their surroundings, and decide what to do next, all voiced through the TTS engine of your choice and powered by your choice of large language model. It is the only project of its kind that runs as a single native SKSE plugin \u2014 no WSL, no Python launcher, no background server window. Install the mod, launch the game, open `localhost:8080`, and you are talking to NPCs in minutes.\n\n# Why it is built this way\n\n- **Speed** \u2014 game state is read straight from memory; TTS starts on the first sentence while the model writes the second; action eligibility is pre-warmed during transcription.\n- **Stability** \u2014 game data is touched only through guarded patterns (reference-counted wrappers, validity checks, strict lock ordering); heavy work runs on worker threads so a slow LLM can never freeze the game.\n- **Setup** \u2014 first launch generates working defaults; a guided web wizard collects API keys.\n- **Performance** \u2014 the game thread is never blocked on network, database or TTS work.\n- **Extensibility** \u2014 Papyrus API and public C++ DLL API; Inja templating with 100+ built-in decorators; YAML-defined actions can call Papyrus quest functions.\n\n# Feature highlights\n\n- Context-aware streaming conversations; 3,000+ pre-written NPC bios; continuous scene mode; realistic perception (whisper mode).\n- Private per-NPC vector memory with importance and decay; diaries; condition-scoped world knowledge; knowledge packs (`.sknpack`); NPC groups.\n- Eight TTS engines (Piper default, PocketTTS, XTTS, ElevenLabs, Inworld, Zonos, Chatterbox, Kokoro) with live cloning on several; per-NPC voice effects; local Whisper STT.\n- PrismaUI in-game chat overlay: `@` targeting with Tab autocomplete, whisper `^` / group `&` modifiers, slash commands (`/think`, `/transform`, `/silent`, `/monologue`, `/compose`, `/playsong`, `/summon`, `/npcthink`, `/telepathy`), inline edit/delete, audience strip.\n- OmniSight vision descriptions; YAML triggers; AI-composed bard songs via Suno; NPC thoughts and telepathy perk channel.\n- Web dashboard (~30 pages) at `localhost:8080`; MCP server on port 8889 exposing 44+ tools; VastAI cloud-GPU provisioning.\n\n# Repository map\n\n| Directory | Purpose |\n|---|---|\n| `spriggit/SkyrimNet/` | Spriggit-serialized ESP source (version controlled) |\n| `plugins/skyrimnet/base/` | `skyrimnet.base` content library (manifest, prompts, bios, translation CSVs) |\n| `Source/Scripts/` | Papyrus script sources (`.psc`) |\n| `headers/` | Vanilla Skyrim Papyrus headers for compilation |\n| `interface/` | MCM/UI templates (DDS icons) |\n| `SKSE/Plugins/SkyrimNet/` | Runtime assets, in-game docs, chat UI |\n| `docs/` | Modder documentation |\n| `model-presets/` | Dashboard model presets |\n| `utilities/` | Bio partition / serialization tooling |\n| `.github/` | CI workflows and issue templates |\n\n# Member files\n\nAll 1 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `README.md` | 24.9KB | 298 | SkyrimNet |\n\n# Related\n\n- SkyrimNet ships its default prompts as the always-enabled [skyrimnet.base bundle](/base-plugin.md).\n- Different model roles are documented under [Model Agents & Usage](/docs/model-agents.md).\n- This bundle was generated from the repository `sources/SkyrimNet-GamePlugin`; each top-level directory (`characters/`, `docs/`, `esp/`, `prompts/`, `reference/`, `runtime/`, `scripts/`, `tools/`) has its own index.\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/README.md`"}, {"id": "prompts/components/character-bio", "type": "Prompt Template", "title": "Character Bio Submodule", "description": "Eighteen numbered sections composing the shared character bio block (header, summary, background, personality, appearance, skills, relationships, memories, speech style).", "tags": ["skyrimnet", "prompts", "inja"], "group": "prompts", "sz": 46, "body": "# Overview\n\nThe 18 numbered sections composing the shared character bio block: header, physical activity, summary, world knowledge, background, personality, interject summary, aspirations, appearance, equipment, skills, relationships, party quests, occupation, memories & progression, identity links, memories, and speech style. Render modes (`full`, `thoughts`, `transform`, `dialogue_target`, `short_inline`, `bio_summary`) control which sections appear, and `suppress_host_persona` switches to an entity-led presentation of the host body.\n\n# Member files\n\nAll 18 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `plugins/skyrimnet/base/prompts/submodules/character_bio/0010_header.prompt` | 3.7KB | 84 | {# Handle the header based on render mode #} |\n| `plugins/skyrimnet/base/prompts/submodules/character_bio/0050_physical_activity.prompt` | 1.9KB | 34 | {% if render_mode == \"full\" or render_mode == \"thoughts\" or render_mode == \"transform\" or render_mode == \"dialogue_targe |\n| `plugins/skyrimnet/base/prompts/submodules/character_bio/0100_summary.prompt` | 1.2KB | 15 | {% if suppress_host_persona and (render_mode == \"full\" or render_mode == \"thoughts\" or render_mode == \"transform\") %} |\n| `plugins/skyrimnet/base/prompts/submodules/character_bio/0130_world_knowledge.prompt` | 364.0B | 11 | {% if render_mode == \"full\" or render_mode == \"thoughts\" or render_mode == \"transform\" %} |\n| `plugins/skyrimnet/base/prompts/submodules/character_bio/0200_background.prompt` | 626.0B | 9 | {# Suppressed in the self-bio when a linked entity fully wears this body (entity_led): the |\n| `plu : "Browser chat interface served by the plugin (JS/HTML/CSS) on localhost:8080.", "tags": ["skyrimnet", "runtime", "assets"], "group": "runtime", "sz": 30, "body": "# Overview\n\nBrowser chat interface served by the plugin: `index.html` plus `styles.css` and five JS modules (`theme`, `messages`, `audience`, `input`, `app`) loaded in dependency order. It renders the PrismaUI chat panel with persistent history, a nearby-NPC audience strip, whisper/mode badges and @-target autocomplete.\n\n# Member files\n\nAll 7 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `SKSE/Plugins/SkyrimNet/chat/app.js` | 1.3KB | 48 | window.updateMessages = function(json) { |\n| `SKSE/Plugins/SkyrimNet/chat/audience.js` | 2.6KB | 80 | let audienceData = { actors: [], whisperMode: false, whisperRadius: 0 }; |\n| `SKSE/Plugins/SkyrimNet/chat/index.html` | 1.5KB | 47 | <!DOCTYPE html> |\n| `SKSE/Plugins/SkyrimNet/chat/input.js` | 5.1KB | 178 | const MODE_PREFIXES = { |\n| `SKSE/Plugins/SkyrimNet/chat/messages.js` | 4.3KB | 142 | let messages = []; |\n| `SKSE/Plugins/SkyrimNet/chat/styles.css` | 7.3KB | 378 | /* Chat overlay styles using CSS custom properties for theming */ |\n| `SKSE/Plugins/SkyrimNet/chat/theme.js` | 2.0KB | 72 | const THEMES = { |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/SKSE/Plugins/SkyrimNet/chat`"}, {"id": "runtime/decorators-doc", "type": "Runtime Asset", "title": "Decorators Reference (HTML)", "description": "Bundled 5,328-line HTML documentation of prompt decorators served by the plugin.", "tags": ["skyrimnet", "runtime", "assets"], "group": "runtime", "sz": 26, "body": "# Overview\n\n`docs/decorators.html` \u2014 the bundled 5,328-line HTML reference served by the plugin, documenting the prompt decorators available to template authors.\n\n# Member files\n\nAll 1 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `SKSE/Plugins/SkyrimNet/docs/decorators.html` | 138.2KB | 5328 | <!DOCTYPE html> |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/SKSE/Plugins/SkyrimNet/docs/decorators.html`"}, {"id": "runtime/legacy-fingerprints", "type": "Runtime Asset", "title": "Legacy Voice Fingerprints", "description": "5,021-line fingerprint database used for legacy voice matching.", "tags": ["skyrimnet", "runtime", "assets"], "group": "runtime", "sz": 26, "body": "# Overview\n\n`legacy-fingerprints.json` \u2014 a 5,021-line database of legacy voice fingerprints used for voice matching, generated by the utilities' fingerprint tooling.\n\n# Member files\n\nAll 1 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `SKSE/Plugins/SkyrimNet/legacy-fingerprints.json` | 220.4KB | 5021 | { |\n\n# Related\n\n- Fingerprints were generated by the [bio partition toolchain](/tools/bios-partition.md).\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/SKSE/Plugins/SkyrimNet/legacy-fingerprints.json`"}, {"id": "runtime/menu-icons", "type": "Runtime Asset", "title": "Menu Icons", "description": "DDS icons for the SkyrimNet interface menus (Skyrimnet1/Skyrimnet2).", "tags": ["skyrimnet", "runtime", "assets"], "group": "runtime", "sz": 27, "body": "# Overview\n\nDDS icons (`Skyrimnet1.dds`, `Skyrimnet2.dds`) under `interface/SkyrimNet/` used by the in-game interface menus.\n\n# Member files\n\nAll 2 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `interface/SkyrimNet/Skyrimnet1.dds` | 333.1KB | 224 | Binary DDS texture (DXT5 compression, ImageMagick-generated); no text content |\n| `interface/SkyrimNet/Skyrimnet2.dds` | 333.1KB | 74 | Binary DDS texture (DXT5 compression, ImageMagick-generated); no text content |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/interface/SkyrimNet/Skyrimnet1.dds`\n[2] `sources/SkyrimNet-GamePlugin/interface/SkyrimNet/Skyrimnet2.dds`"}, {"id": "runtime/names-distributor", "type": "Configuration", "title": "NPC Names Distributor Config", "description": "INI configuration for the NPCs Names Distributor SKSE component.", "tags": ["skyrimnet", "runtime", "assets"], "group": "runtime", "sz": 26, "body": "# Overview\n\n`NPCsNamesDistributor.ini` \u2014 configuration for the NPCs Names Distributor SKSE component used by the name pipeline.\n\n# Member files\n\nAll 1 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `SKSE/Plugins/NPCsNamesDistributor.ini` | 2.1KB | 82 | \ufeff[General] |\n\n# Related\n\n- Name distribution complements the [name migration scripts](/scripts/name-migration.md).\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/SKSE/Plugins/NPCsNamesDistributor.ini`"}, {"id": "runtime/voice-assets", "type": "Runtime Asset", "title": "Voice & Feedback Audio Assets", "description": "WAV cues for input start/end, empty buffer and failed transcription, plus the plugin logo.", "tags": ["skyrimnet", "runtime", "assets"], "group": "runtime", "sz": 31, "body": "# Overview\n\nShort audio feedback cues for the voice pipeline (`input_start`, `input_end`, an `empty_100ms` filler, and `no_transcription`) plus the SkyrimNet logo image.\n\n# Member files\n\nAll 5 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `SKSE/Plugins/SkyrimNet/assets/SkyrimNetLogo256.jpg` | 18.0KB | 62 | Binary JPEG image (JFIF/Exif, SkyrimNet logo); no text content |\n| `SKSE/Plugins/SkyrimNet/assets/empty_100ms.wav` | 4.8KB | 1 | Binary RIFF/WAVE PCM audio - 100 ms silence filler (Lavf58.76.100 encoder tag); no text content |\n| `SKSE/Plugins/SkyrimNet/assets/input_end.wav` | 39.9KB | 80 | Binary RIFF/WAVE PCM audio - input-end feedback cue; no text content |\n| `SKSE/Plugins/SkyrimNet/assets/input_start.wav` | 39.9KB | 82 | Binary RIFF/WAVE PCM audio - input-start feedback cue; no text content |\n| `SKSE/Plugins/SkyrimNet/assets/no_transcription.wav` | 184.6KB | 978 | Binary RIFF/WAVE PCM audio - failed-transcription cue (Lavf58.29.100 encoder tag); no text content |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/SKSE/Plugins/SkyrimNet/assets/SkyrimNetLogo256.jpg`\n[2] `sources/SkyrimNet-GamePlugin/SKSE/Plugins/SkyrimNet/assets/empty_100ms.wav`\n[3] `sources/SkyrimNet-GamePlugin/SKSE/Plugins/SkyrimNet/assets/input_end.wav`\n[4] `sources/SkyrimNet-GamePlugin/SKSE/Plugins/SkyrimNet/assets/input_start.wav`\n[5] `sources/SkyrimNet-GamePlugin/SKSE/Plugins/SkyrimNet/assets/no_transcription.wav`"}, {"id": "runtime/voice-effects", "type": "Runtime Asset", "title": "Original Voice Effect Presets", "description": "Per-creature-type audio effect YAML presets (draugr, dremora, ghost, dragon priest, vampire lord, werewolf, narrator reverb, player thought overlay).", "tags": ["skyrimnet", "runtime", "assets"], "group": "runtime", "sz": 31, "body": "# Overview\n\nBuilt-in YAML voice-effect recipes applied per NPC: creature voices (dragon priest, draugr, dremora, ghost, vampire lord, werewolf) and overlays (narrator reverb, player thought overlay). Recipes are hot-reloadable and editable in the web UI with audio preview.\n\n# Member files\n\nAll 8 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `SKSE/Plugins/SkyrimNet/original_voice_effects/dragon_priest.yaml` | 373.0B | 21 | id: dragon_priest |\n| `SKSE/Plugins/SkyrimNet/original_voice_effects/draugr.yaml` | 394.0B | 23 | id: draugr |\n| `SKSE/Plugins/SkyrimNet/original_voice_effects/dremora.yaml` | 338.0B | 20 | id: dremora |\n| `SKSE/Plugins/SkyrimNet/original_voice_effects/ghost.yaml` | 356.0B | 21 | id: ghost |\n| `SKSE/Plugins/SkyrimNet/original_voice_effects/narrator_reverb.yaml` | 156.0B | 9 | id: narrator_effect |\n| `SKSE/Plugins/SkyrimNet/original_voice_effects/player_thought_overlay.yaml` | 168.0B | 9 | id: player_thought_effect |\n| `SKSE/Plugins/SkyrimNet/original_voice_effects/vampire_lord.yaml` | 419.0B | 24 | id: vampire_lord |\n| `SKSE/Plugins/SkyrimNet/original_voice_effects/werewolf.yaml` | 330.0B | 19 | id: werewolf |\n\n# Related\n\n- Effect presets process the [audio feedback cues](/runtime/voice-assets.md).\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/SKSE/Plugins/SkyrimNet/original_voice_effects`"}, {"id": "scripts/api", "type": "Papyrus Script", "title": "Public & Internal API Scripts", "description": "SkyrimNetApi.psc (869 lines) public API and SkyrimNetInternal.psc (383 lines) internal bridge.", "tags": ["skyrimnet", "papyrus", "scripts"], "group": "scripts", "sz": 27, "body": "# Overview\n\n`SkyrimNetApi.psc` (869 lines) is the public Papyrus API other mods call \u2014 decorator registration, events, memories, world knowledge and more; `SkyrimNetInternal.psc` (383 lines) is the internal bridge used by shipped scripts.\n\n# Member scripts\n\nAll 2 member items assigned to this concept (verified against the manifest):\n\n| Source file | Scriptname | Extends | Lines |\n|---|---|---|---|\n| `Source/Scripts/SkyrimNetApi.psc` | `SkyrimNetApi` | \u2014 | 869 |\n| `Source/Scripts/SkyrimNetInternal.psc` | `` | \u2014 | 383 |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/Source/Scripts/SkyrimNetApi.psc`\n[2] `sources/SkyrimNet-GamePlugin/SkyrimNetInternal.psc`"}, {"id": "scripts/core-runtime", "type": "Papyrus Script", "title": "Core Runtime Scripts", "description": "Main controller, shared library, MinAI bridge, player alias, harness and example integration script.", "tags": ["skyrimnet", "papyrus", "scripts"], "group": "scripts", "sz": 32, "body": "# Overview\n\nCore Papyrus runtime scripts: `skynet_MainController` (161 lines) is the controller quest script; `skynet_Library` (907 lines) is the shared library quest; `skynet_MinAIBridge` listens for MinAI mod events and forwards them through SkyrimNet's native API; `skynet_PlayerAlias`, `skynet_Harness` and `skynet_ExampleScript` attach the system to the player and demonstrate integration.\n\n# Compile\n\n```\npapyrus.exe -nocache -h headers -i Source/Scripts -output Scripts\n```\n\n# Member scripts\n\nAll 6 member items assigned to this concept (verified against the manifest):\n\n| Source file | Scriptname | Extends | Lines |\n|---|---|---|---|\n| `Source/Scripts/skynet_ExampleScript.psc` | `` | \u2014 | 7 |\n| `Source/Scripts/skynet_Harness.psc` | `skynet_Harness` | \u2014 | 34 |\n| `Source/Scripts/skynet_Library.psc` | `skynet_Library` | Quest | 907 |\n| `Source/Scripts/skynet_MainController.psc` | `` | \u2014 | 161 |\n| `Source/Scripts/skynet_MinAIBridge.psc` | `skynet_MinAIBridge` | Quest | 161 |\n| `Source/Scripts/skynet_PlayerAlias.psc` | `skynet_PlayerAlias` | ReferenceAlias | 7 |\n\n# Related\n\n- Runtime bootstraps through the [main controller quest](/esp/quests.md).\n- The controller drives the [dialogue and follow packages](/esp/packages.md).\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/Source/Scripts/skynet_MainController.psc`\n[2] `sources/SkyrimNet-GamePlugin/skynet_Library.psc`\n[3] `sources/SkyrimNet-GamePlugin/skynet_MinAIBridge.psc`\n[4] `sources/SkyrimNet-GamePlugin/skynet_PlayerAlias.psc`\n[5] `sources/SkyrimNet-GamePlugin/skynet_Harness.psc`\n[6] `sources/SkyrimNet-GamePlugin/skynet_ExampleScript.psc`"}, {"id": "scripts/mcm-config", "type": "Papyrus Script", "title": "MCM & Config Scripts", "description": "skynet_McmScript (1,299 lines) and ConfigUtilityMenu implementing the mod configuration menu.", "tags": ["skyrimnet", "papyrus", "scripts"], "group": "scripts", "sz": 27, "body": "# Overview\n\nMod Configuration Menu scripts: `skynet_McmScript` extends `SKI_ConfigBase` (1,299 lines; page properties are filled via the CK on the `skynet_Mcm` quest record) and `skynet_ConfigUtilityMenu` provides the config utility menu.\n\n# Member scripts\n\nAll 2 member items assigned to this concept (verified against the manifest):\n\n| Source file | Scriptname | Extends | Lines |\n|---|---|---|---|\n| `Source/Scripts/skynet_ConfigUtilityMenu.psc` | `` | \u2014 | 90 |\n| `Source/Scripts/skynet_McmScript.psc` | `skynet_McmScript` | SKI_ConfigBase | 1299 |\n\n# Related\n\n- MCM scripts attach to the [MCM quest](/esp/quests.md).\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/Source/Scripts/skynet_McmScript.psc`\n[2] `sources/SkyrimNet-GamePlugin/skynet_ConfigUtilityMenu.psc`"}, {"id": "scripts/name-migration", "type": "Papyrus Script", "title": "Name Migration & Debug Scripts", "description": "RealNamesChange/RealNamesReset migration scripts and the agDebugLever debug object.", "tags": ["skyrimnet", "papyrus", "scripts"], "group": "scripts", "sz": 27, "body": "# Overview\n\nOne-off maintenance scripts: `RealNamesChange`/`RealNamesReset` for migrating distributed NPC names, and the `SkyrimNet_agDebugLever01` debug activator.\n\n# Member scripts\n\nAll 3 member items assigned to this concept (verified against the manifest):\n\n| Source file | Scriptname | Extends | Lines |\n|---|---|---|---|\n| `Source/Scripts/RealNamesChange.psc` | `` | \u2014 | 825 |\n| `Source/Scripts/RealNamesReset.psc` | `` | \u2014 | 51 |\n| `Source/Scripts/SkyrimNet_agDebugLever01.psc` | `SkyrimNet_agDebugLever01` | ObjectReference | 20 |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/Source/Scripts/RealNamesChange.psc`\n[2] `sources/SkyrimNet-GamePlugin/RealNamesReset.psc`\n[3] `sources/SkyrimNet-GamePlugin/SkyrimNet_agDebugLever01.psc`"}, {"id": "scripts/voice-telepathy", "type": "Papyrus Script", "title": "Voice Input & Telepathy Scripts", "description": "Magic-effect scripts for the four voice-input modes, wheel menu, telepathy eavesdrop/listen-in and the text-entry overlay.", "tags": ["skyrimnet", "papyrus", "scripts"], "group": "scripts", "sz": 32, "body": "# Overview\n\nInput-channel scripts: four `skynet_VoiceInput*` ActiveMagicEffect scripts (Direct, Normal, Thought, Transform \u2014 text input modes are handled via prefixes in the PrismaUI chat), `skynet_WheelMenu` (the function called from the DLL for the input wheel), telepathy `Eavesdrop`/`ListenIn` powers, and the `uitextentrymenu` text-entry overlay.\n\n# Member scripts\n\nAll 8 member items assigned to this concept (verified against the manifest):\n\n| Source file | Scriptname | Extends | Lines |\n|---|---|---|---|\n| `Source/Scripts/skynet_TelepathyEavesdrop.psc` | `skynet_TelepathyEavesdrop` | ActiveMagicEffect | 12 |\n| `Source/Scripts/skynet_TelepathyListenIn.psc` | `skynet_TelepathyListenIn` | ActiveMagicEffect | 16 |\n| `Source/Scripts/skynet_VoiceInputDirect.psc` | `skynet_VoiceInputDirect` | ActiveMagicEffect | 14 |\n| `Source/Scripts/skynet_VoiceInputNormal.psc` | `skynet_VoiceInputNormal` | ActiveMagicEffect | 14 |\n| `Source/Scripts/skynet_VoiceInputThought.psc` | `skynet_VoiceInputThought` | ActiveMagicEffect | 14 |\n| `Source/Scripts/skynet_VoiceInputTransform.psc` | `skynet_VoiceInputTransform` | ActiveMagicEffect | 14 |\n| `Source/Scripts/skynet_WheelMenu.psc` | `skynet_WheelMenu` | ActiveMagicEffect | 181 |\n| `Source/Scripts/uitextentrymenu.psc` | `UITextEntryMenu` | UIMenuBase | 141 |\n\n# Related\n\n- Voice scripts are attached by the [voice input spells](/esp/spells.md).\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/Source/Scripts/skynet_VoiceInput{Direct,Normal,Thought,Transform}.psc`\n[2] `sources/SkyrimNet-GamePlugin/skynet_WheelMenu.psc`\n[3] `sources/SkyrimNet-GamePlugin/skynet_Telepathy{Eavesdrop,ListenIn}.psc`\n[4] `sources/SkyrimNet-GamePlugin/uitextentrymenu.psc`"}, {"id": "tools/bios-partition", "type": "Utility", "title": "Bio Partition Tool", "description": "Historical one-time tool that split 3,098 bios into skyrimnet.base and per-mod hub packs; ships audit reports and hand-attribute overrides.", "tags": ["skyrimnet", "tooling"], "group": "tools", "sz": 30, "body": "# Overview\n\nHistorical, one-time bio partition tool: it split the pre-restructure `original_prompts/characters/` (3,098 bios) into the bios kept in `skyrimnet.base` and per-source-mod `skyrimnet.bios-{mod}` hub packs (Core `ai_docs/CONTENT_STORE_DESIGN.md`, ruling 26). The paths it targeted no longer exist \u2014 run it against commit `3700301` or earlier. Its audit trail lives in `report/`; `overrides.csv` records hand attributions.\n\n# Member files\n\nAll 8 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `utilities/bios/README.md` | 2.3KB | 42 | Bio partition tool |\n| `utilities/bios/generate_legacy_fingerprints.py` | 2.7KB | 71 | !/usr/bin/env python3 |\n| `utilities/bios/overrides.csv` | 13.8KB | 88 | bioKey,target,note |\n| `utilities/bios/partition_bios.py` | 12.3KB | 286 | !/usr/bin/env python3 |\n| `utilities/bios/report/assignment.csv` | 92.0KB | 3099 | bioKey,targets |\n| `utilities/bios/report/multi-claim.csv` | 6.0KB | 59 | bioKey,claimants,shippedIn |\n| `utilities/bios/report/packs.csv` | 8.0KB | 216 | slug,bioCount,pluginFiles |\n| `utilities/bios/report/unattributed.txt` | 1.8KB | 80 | adilya_generic |\n\n# Citations\n\n[1] `sources/SkyrimNet-GamePlugin/utilities/bios`"}, {"id": "tools/plugin-serialization", "type": "Utility", "title": "Plugin Serialization Script", "description": "PowerShell helper (serialize_gameplugin.ps1) for serializing the game plugin.", "tags": ["skyrimnet", "tooling"], "group": "tools", "sz": 26, "body": "# Overview\n\n`serialize_gameplugin.ps1` \u2014 PowerShell helper for serializing the game plugin as part of the build tooling.\n\n# Member files\n\nAll 1 member items assigned to this concept (verified against the manifest):\n\n| Source file | Size | Lines | Summary |\n|---|---|---|---|\n| `utilities/serialize_gameplugin.ps1` | 1.3KB | 31 | Extract SpriggitCLI.zip to the \"external\" directory if it doesn't already exist |\n\n# Citations\n\n[1] `sources/Sky
